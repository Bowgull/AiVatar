<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>37 band</title>
<!-- Sheet 37 v2: on the Mac, until its own Aang and bubble exist, the plan drops from Samara's band in the update tray's
     own frame (browser.css .dltray.uptray.upx: gold caps, wood header with the lantern, parchment list, keycaps). -->
<link rel="stylesheet" href="../../../src/Shell/pages/cockpit.css">
<link rel="stylesheet" href="../../../src/Shell/pages/browser.css">
<style>
  html,body{background:transparent;margin:0;overflow:hidden!important;height:auto!important}
  body{padding:16px 14px}
  .dltray{position:relative!important;right:auto!important;top:auto!important;display:block}
  .upx .uplist{max-height:none}
  .row{display:flex;align-items:center;gap:9px;margin:5px 0;font:600 13.5px var(--body);color:#2a1c0c}
  .row small{font:500 11.5px var(--body);color:#7a5a36}
  .row .sp{flex:1}
  .tq{flex:none;width:17px;height:17px;border:2.5px solid #120A05;border-radius:4px;box-sizing:border-box;position:relative;background:#3FBFAE;
    box-shadow:0 0 6px rgba(159,240,230,.9),0 2px 0 rgba(0,0,0,.35)}
  .tq::after{content:"";position:absolute;left:4px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .num{width:20px;text-align:center;font:400 11px var(--label);color:#8a3e1c}
  .wont{display:flex;gap:8px;align-items:center;margin:0 14px 10px;font:600 12.5px var(--body);color:#f0c9a8}
  .upfoot{display:flex;gap:8px;margin:0 12px}
  .key.burnt{background:#C8602A;color:#fff2e4;text-shadow:0 1px 0 rgba(0,0,0,.5)}
</style>
</head>
<body>
  <div class="dltray uptray upx">
    <div class="caps" aria-hidden="true"></div>
    <div class="uphd"><img src="../../../src/Shell/pages/art/samara/samara-lantern-32.png" alt=""><div class="t"><small>CLAUDE WANTS TO</small><b>Start a job scan</b></div></div>
    <div class="uplist">
      <div class="grp">SITES</div>
      <div class="row"><img src="favicons/www.linkedin.com.ico" width="18" height="18" alt="" style="border-radius:3px">LinkedIn <small>with your login</small><span class="sp"></span><i class="tq"></i></div>
      <div class="row"><i data-pix="globe"></i>Greenhouse, Lever, Ashby<span class="sp"></span><i class="tq"></i></div>
      <div class="row"><i data-pix="globe"></i>Job Bank<span class="sp"></span><i class="tq"></i></div>
      <div class="grp">STEPS</div>
      <div class="row"><span class="num">1</span>Search your 13 job types</div>
      <div class="row"><span class="num">2</span>Read the new posts</div>
      <div class="row"><span class="num">3</span>Save the list in your job folder</div>
    </div>
    <div class="wont"><i data-pix="wont"></i>Won't apply, send, or sign in anywhere new.</div>
    <div class="upfoot"><button class="key primary sm" type="button">Go</button><button class="key sm" type="button">Change</button><button class="key sm burnt" type="button">Not now</button></div>
  </div>
<script type="module">import { paintIcons } from './icons.js'; paintIcons();</script>
</body>
</html>
