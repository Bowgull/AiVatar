<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>37 sites</title>
<!-- Sheet 37 v2: Settings > Privacy, "Your sites", two ideas for him to pick (his answer: "draw both"). Inside the real
     settings.css card (trayframe border, gold caps). A = a Zelda item row per site: lit = allowed, dim = asks, red cross =
     blocked; click a slot to change it. B = a Stardew collection: every site a tile; pick one and its rules open beside
     it, the same panel as the shield. -->
<link rel="stylesheet" href="../../../src/Shell/pages/cockpit.css">
<link rel="stylesheet" href="../../../src/Shell/pages/settings.css">
<style>
  html,body{margin:0;overflow:hidden!important;height:auto!important}
  body{padding:16px 16px 0;width:1180px;display:flex;gap:22px;align-items:flex-start}
  .col{flex:1;min-width:0}
  .cap{font:400 10px Silkscreen,monospace;color:#FFC43C;letter-spacing:1.5px;margin:0 0 12px;text-shadow:1px 1px 0 #000}
  .card{margin:0}
  .find{margin:6px 24px 10px;padding:7px 12px;border-radius:8px;background:#0B0718;border:2.5px solid #120A05;font:500 14px var(--body);color:#8a8099;box-shadow:inset 0 3px 0 rgba(0,0,0,.6)}
  /* A: item rows */
  .legend{display:grid;grid-template-columns:150px repeat(6,36px);gap:6px;padding:0 24px 4px;font:400 7.5px var(--label);letter-spacing:.5px;color:#ffe28c;text-align:center}
  .site{display:grid;grid-template-columns:150px repeat(6,36px);gap:6px;align-items:center;padding:7px 24px;border-top:2px solid rgba(255,255,255,.05)}
  .site b{font:700 14.5px var(--body);color:#fff2d6;text-shadow:1px 1px 0 #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site b small{display:block;font:400 8px var(--label);letter-spacing:1px;color:#ff9a7a;margin-top:2px}
  .slot{width:36px;height:34px;border-radius:7px;display:grid;place-items:center;position:relative;cursor:pointer;
    background:#120a1e;box-shadow:inset 0 3px 0 rgba(0,0,0,.65),inset 0 0 0 2px #2a1f3a}
  .slot.yes{background:radial-gradient(circle,rgba(255,196,60,.32),rgba(255,196,60,.05) 70%),#1f1530;box-shadow:inset 0 0 0 2px #FFC43C,0 0 8px rgba(255,196,60,.45)}
  .slot.ask .pix{opacity:.38;filter:grayscale(.6)}
  .slot.no .pix{opacity:.45;filter:grayscale(1)}
  .slot.no::after{content:"";position:absolute;inset:6px;background:
    linear-gradient(45deg,transparent 44%,#E0402A 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#E0402A 44% 56%,transparent 56%);filter:drop-shadow(1px 1px 0 #000)}
  .slot.lock{cursor:default}
  .key3{display:flex;gap:16px;padding:8px 24px 16px;font:500 12.5px var(--body);color:#c9bfdc;align-items:center}
  .key3 .slot{width:26px;height:24px;cursor:default}
  .wait{margin:4px 24px 16px;padding:9px 12px;border-radius:8px;border:2px dashed rgba(159,240,230,.45);font:600 13px var(--body);color:#e6dcc8;display:flex;gap:10px;align-items:center}
  .wait b{color:#9FF0E6}
  /* B: collection tiles */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 24px 18px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:9px;cursor:pointer;position:relative;
    background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.35)),url(../../../src/Shell/pages/art/browser/tray.png) 0 0/128px 256px;box-shadow:inset 0 0 0 2px #120A05,0 3px 0 #0b0610}
  .tile span{font:700 11.5px var(--body);color:#f1e4cc;text-shadow:1px 1px 0 #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.sel{box-shadow:inset 0 0 0 2px #FFC43C,0 0 10px rgba(255,196,60,.5),0 3px 0 #0b0610}
  .tile.sel::before{content:"";position:absolute;left:-14px;top:12px;width:24px;height:18px;background:url(../../../src/Shell/pages/art/browser/hand.png) 0 0/24px 18px;image-rendering:pixelated}
  .tile .dots{display:flex;gap:3px}
  .tile .dots u{width:6px;height:6px;text-decoration:none;background:#4a3a5a}
  .tile .dots u.y{background:#FFC43C}.tile .dots u.n{background:#E0402A}
  .tile.bank{opacity:.7}
  .bside{display:flex;gap:16px;align-items:flex-start}
  .bside iframe{border:0;flex:none}
</style>
</head>
<body>
<div class="col">
  <p class="cap">A &middot; ITEM ROWS</p>
  <div class="card"><i class="caps"></i>
    <h3>YOUR SITES</h3>
    <div class="find">Find a site</div>
    <div class="legend"><span></span><span>AI</span><span>LOGIN</span><span>CAMERA</span><span>MIC</span><span>POPUPS</span><span>ADS</span></div>
    <div id="rows"></div>
    <div class="key3"><span class="slot yes"><i data-pix="ai" data-scale="1.5"></i></span>Allowed <span class="slot ask"><i data-pix="ai" data-scale="1.5"></i></span>Asks <span class="slot no"><i data-pix="ai" data-scale="1.5"></i></span>Blocked <span style="margin-left:auto">Click a slot to change it.</span></div>
    <div class="wait"><i data-pix="globe"></i><span><b>From your other computer:</b> github.com is trusted there. It asks once here.</span></div>
  </div>
</div>
<div class="col" style="flex:1.15">
  <p class="cap">B &middot; COLLECTION</p>
  <div class="card"><i class="caps"></i>
    <h3>YOUR SITES</h3>
    <div class="find">Find a site</div>
    <div class="bside">
      <div class="grid" id="tiles" style="flex:1"></div>
    </div>
  </div>
  <p class="cap" style="margin-top:12px">PICK A TILE: ITS RULES OPEN (THE SAME PANEL AS THE SHIELD)</p>
  <iframe src="shield.html?v=s" width="340" height="460" title="rules" style="border:0"></iframe>
</div>
<script type="module">
import { pix, paintIcons } from './icons.js';
const SITES = [
  ['linkedin.com', 'job', ['yes', 'yes', 'ask', 'ask', 'no', 'no']],
  ['meet.google.com', 'camera', ['yes', 'ask', 'yes', 'yes', 'no', 'no']],
  ['youtube.com', 'play', ['yes', 'ask', 'ask', 'ask', 'no', 'yes']],
  ['reddit.com', 'globe', ['no', 'no', 'ask', 'ask', 'no', 'no']],
  ['rbc.com', 'key', ['no', 'no', '', '', '', ''], 'BANK: OPENS IN CHROME'],
];
const KINDS = ['ai', 'key', 'camera', 'mic', 'popup', 'ads'];
const rows = document.getElementById('rows');
for (const [name, , st, note] of SITES) {
  const r = document.createElement('div'); r.className = 'site';
  r.innerHTML = `<b>${name}${note ? `<small>${note}</small>` : ''}</b>`;
  st.forEach((s, i) => {
    const sl = document.createElement('span');
    if (!s) { r.append(sl); return; }
    sl.className = 'slot ' + s + (note ? ' lock' : ''); sl.append(pix(KINDS[i], 2));
    if (!note) sl.onclick = () => { const o = ['yes', 'ask', 'no']; const c = o.find((x) => sl.classList.contains(x)); sl.classList.remove(c); sl.classList.add(o[(o.indexOf(c) + 1) % 3]); };
    r.append(sl);
  });
  rows.append(r);
}
const tiles = document.getElementById('tiles');
[...SITES, ['github.com', 'globe', ['yes', 'ask', 'ask', 'ask', 'no', 'no']], ['twitch.tv', 'play', ['yes', 'ask', 'ask', 'ask', 'no', 'yes']], ['spotify.com', 'play', ['yes', 'yes', 'ask', 'ask', 'no', 'no']]].forEach(([name, icon, st, note], i) => {
  const t = document.createElement('div'); t.className = 'tile' + (i === 0 ? ' sel' : '') + (note ? ' bank' : '');
  t.append(pix(icon, 3));
  const s = document.createElement('span'); s.textContent = name; t.append(s);
  const d = document.createElement('i'); d.className = 'dots'; d.innerHTML = st.map((x) => `<u class="${x === 'yes' ? 'y' : x === 'no' ? 'n' : ''}"></u>`).join(''); t.append(d);
  t.onclick = () => { for (const x of tiles.children) x.classList.remove('sel'); t.classList.add('sel'); };
  tiles.append(t);
});
paintIcons();
</script>
</body>
</html>
