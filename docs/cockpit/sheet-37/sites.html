<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>37 sites</title>
<!-- Sheet 37 v3: Settings > Privacy, "Your sites", his pick A (item rows), fixed: every rule in the shield is here and works
     the same way. The four on/off switches (Claude and Aang, my login, ad blocker, dark mode) are lit or dark; the three
     three-way ones (camera, mic, popups) are gold Allow, plum Ask, or a red Block mark. Each site's real icon (Samara's
     browser-favicons.json). Aang's own face stands for "Claude and Aang". Inside the real settings.css card. -->
<link rel="stylesheet" href="../../../src/Shell/pages/cockpit.css">
<link rel="stylesheet" href="../../../src/Shell/pages/settings.css">
<style>
  html,body{margin:0;overflow:hidden!important;height:auto!important}
  body{padding:16px 16px 0;width:760px}
  .cap{font:400 10px Silkscreen,monospace;color:#FFC43C;letter-spacing:1.5px;margin:0 0 12px;text-shadow:1px 1px 0 #000}
  .card{margin:0}
  .find{margin:6px 24px 12px;padding:8px 12px;border-radius:8px;background:#0B0718;border:2.5px solid #120A05;font:500 14px var(--body);color:#8a8099;box-shadow:inset 0 3px 0 rgba(0,0,0,.6)}
  .grid{--cols:200px 46px 46px 46px 46px 18px 46px 46px 46px;display:grid;grid-template-columns:var(--cols);column-gap:12px;align-items:center}
  .groups,.legend,.site{padding-left:24px;padding-right:24px}
  .groups span{font:400 9px var(--label);letter-spacing:1.5px;color:#c9a35a;text-align:center;border-bottom:2px solid rgba(201,163,90,.35);padding-bottom:4px}
  .groups .ai{grid-column:2 / span 4}.groups .use{grid-column:7 / span 3}
  .legend{margin-top:6px}
  .legend span{font:400 9.5px var(--label);letter-spacing:.5px;color:#ffe28c;text-align:center;line-height:1.25}
  .site{padding-top:12px;padding-bottom:12px;border-top:2px solid rgba(255,255,255,.06)}
  .site b{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font:700 15.5px var(--body);color:#fff2d6;text-shadow:1px 1px 0 #000;min-width:0}
  .site b small{flex-basis:100%;margin-left:29px;font:400 8.5px var(--label);letter-spacing:1px;color:#ff9a7a}
  .fav{flex:none;border-radius:4px;background:#fff;padding:2px;box-shadow:0 0 0 2px #120A05}
  .slot{width:46px;height:42px;border-radius:7px;display:grid;place-items:center;position:relative;cursor:pointer;
    background:#120a1e;box-shadow:inset 0 3px 0 rgba(0,0,0,.65),inset 0 0 0 2px #2a1f3a}
  .slot .pix,.slot img{opacity:.32;filter:grayscale(.85)}
  .slot img{width:27px;height:27px;image-rendering:pixelated}
  /* on, or allowed: lit gold */
  .slot.on{background:radial-gradient(circle,rgba(255,196,60,.32),rgba(255,196,60,.05) 70%),#1f1530;box-shadow:inset 0 0 0 2px #FFC43C,0 0 8px rgba(255,196,60,.45)}
  .slot.on .pix,.slot.on img{opacity:1;filter:none}
  /* asks: a plum ring, the icon half lit */
  .slot.ask{box-shadow:inset 0 0 0 2px #8f6ad8,inset 0 3px 0 rgba(0,0,0,.4)}
  .slot.ask .pix{opacity:.75;filter:none}
  /* blocked: a small red mark in the corner, the icon dark */
  .slot.block::after{content:"";position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:3px;background:#C8402E;box-shadow:0 0 0 1.5px #120A05;
    -webkit-mask:linear-gradient(45deg,transparent 40%,#000 40% 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,#000 40% 60%,transparent 60%);mask-composite:add}
  .slot.block::before{content:"";position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:3px;background:#3a0f0a;box-shadow:0 0 0 1.5px #120A05}
  .slot.never{cursor:default;box-shadow:inset 0 0 0 2px #6e1d10}
  .slot.never::after{content:"";position:absolute;inset:8px;background:linear-gradient(45deg,transparent 45%,#C8402E 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#C8402E 45% 55%,transparent 55%)}
  .key4{display:flex;gap:18px;padding:12px 24px 18px;font:500 13px var(--body);color:#d9cfe9;align-items:center;flex-wrap:wrap}
  .key4 .slot{width:30px;height:28px;cursor:default}
  .key4 .slot .pix{transform:scale(.7)}
  .key4 em{font-style:normal;margin-left:auto;color:#a99fbf}
</style>
</head>
<body>
  <p class="cap">SETTINGS &gt; PRIVACY &amp; PROTECTION</p>
  <div class="card"><i class="caps"></i>
    <h3>YOUR SITES</h3>
    <div class="find">Find a site</div>
    <div class="grid groups"><span style="border:none"></span><span class="ai">SAMARA</span><span style="border:none"></span><span class="use">THIS SITE CAN USE</span></div>
    <div class="grid legend"><span></span><span>CLAUDE<br>+ AANG</span><span>MY<br>LOGIN</span><span>AD<br>BLOCK</span><span>DARK<br>MODE</span><span></span><span>CAMERA</span><span>MIC</span><span>POPUPS</span></div>
    <div id="rows"></div>
    <div class="key4">
      <span class="slot on"><i data-pix="camera"></i></span>On or allowed
      <span class="slot"><i data-pix="camera"></i></span>Off
      <span class="slot ask"><i data-pix="camera"></i></span>Asks
      <span class="slot block"><i data-pix="camera"></i></span>Blocked
      <em>Click a slot to change it.</em>
    </div>
  </div>
<script type="module">
import { pix, basePix, paintIcons } from './icons.js';
// Each site's own icon, the one Samara keeps when he visits (browser-favicons.json), as bookmarks show it.
const FAV = { 'linkedin.com': 'www.linkedin.com', 'meet.google.com': 'meet.google.com', 'youtube.com': 'www.youtube.com', 'reddit.com': 'www.reddit.com', 'rbc.com': 'www.rbc.com' };
// Same order and kinds as the shield: four on/off, then three that allow, ask or block.
const COLS = [['face', 2], ['key', 2], ['ads', 2], ['moon', 2], null, ['camera', 3], ['mic', 3], ['popup', 3]];
const SITES = [
  ['linkedin.com', ['on', 'on', 'on', 'off', null, 'ask', 'ask', 'block']],
  ['meet.google.com', ['on', 'off', 'on', 'off', null, 'on', 'on', 'block']],
  ['youtube.com', ['on', 'off', 'off', 'on', null, 'ask', 'ask', 'block']],
  ['reddit.com', ['off', 'off', 'on', 'on', null, 'ask', 'ask', 'block']],
  ['rbc.com', ['never', 'never', '', '', null, '', '', ''], 'BANK: CHROME ONLY'],
];
const icon = (k) => {
  if (k === 'face') { const i = document.createElement('img'); i.src = '../../../src/Shell/pages/art/aang-face.png'; i.alt = ''; return i; }
  return k === 'moon' ? basePix('moon', 2) : pix(k, 2.4);
};
const rows = document.getElementById('rows');
for (const [name, st, note] of SITES) {
  const r = document.createElement('div'); r.className = 'grid site';
  const b = document.createElement('b');
  const f = document.createElement('img'); f.src = `favicons/${FAV[name]}.ico`; f.width = 20; f.height = 20; f.className = 'fav'; f.alt = '';
  b.append(f, name); if (note) { const s = document.createElement('small'); s.textContent = note; b.append(s); }
  r.append(b);
  COLS.forEach((c, i) => {
    const sl = document.createElement('span');
    if (!c) { r.append(sl); return; }
    const s = st[i];
    if (!s) { r.append(sl); return; }
    sl.className = 'slot ' + (s === 'off' ? '' : s);
    sl.title = ['Claude and Aang', 'Use my login', 'Ad blocker', 'Dark mode', '', 'Camera', 'Microphone', 'Popups'][i];
    if (s !== 'never') sl.append(icon(c[0]));
    if (s !== 'never') sl.onclick = () => {
      const order = c[1] === 2 ? ['on', ''] : ['on', 'ask', 'block'];
      const cur = order.find((x) => x && sl.classList.contains(x)) ?? '';
      sl.className = 'slot ' + order[(order.indexOf(cur) + 1) % order.length];
    };
    r.append(sl);
  });
  rows.append(r);
}
paintIcons();
</script>
</body>
</html>
