  g.addEventListener('pointerdown',e=>{e.preventDefault();g.classList.add('down');g._pic=!!(im&&e.target===im)});
  g.addEventListener('pointerup',()=>{if(!g.classList.contains('down'))return;g.classList.remove('down');
    if(g._pic&&p){PR.open=PR.open===id?null:id;drawSugg()}else ahSearch(n)});
  g.addEventListener('pointercancel',()=>g.classList.remove('down'));
  return g}
function drawSugg(){
  const el=tp.el;if(!el)return;const box=el.querySelector('.sugg'),i=el.querySelector('.slot input');
  box.textContent='';if(document.activeElement!==i)return;
  const typed=i.value.trim().length>=2;
  const rows=typed?suggest(i.value).map(it=>[it.n,it.id,it.q]):ahRecent().map(x=>[x.n,x.id,x.q]);
  if(!typed&&rows.length)box.appendChild($('div','hdr','RECENT'));
  for(const [n,id,q] of rows)box.appendChild(sugRow(n,id,q));
  loadPrices(rows.map(x=>x[1]).filter(Boolean));
}
let ahBusy=false;
async function ahSearch(text){
  const el=tp.el;text=String(text||'').trim();if(!el||!text||ahBusy)return;ahBusy=true;knock();
  const item=ITEM_BY&&ITEM_BY.get(text.toLowerCase());if(item)text=item.n;   // a known item: searched exactly that item
  let ok=false,why='';try{const a=await api('/api/ah',{text:item?item.l+'/exact':text});ok=a.ok;why=a.j&&a.j.why||''}catch(e){}finally{ahBusy=false}
  const slot=el.querySelector('.slot'),i=slot.querySelector('input');
  if(!ok){slot.classList.add('no');setTimeout(()=>slot.classList.remove('no'),1200);i.value='';i.placeholder=why==='chat-open'?'WoW’s chat box is open':why==='no-ah'?'The auction house isn’t open':why==='not-in-wow'?'WoW isn’t in front':'Not sent, try again';clearTimeout(i._t);i._t=setTimeout(()=>{i.placeholder=''},4000);if(document.activeElement!==i)el.classList.remove('kb');drawSugg();return}   // the slot itself says why (the pad's line is hidden under the keyboard)
  rememberSearch(text);i.value='';i.blur();el.classList.remove('kb');drawSugg();settle();slot.classList.add('sent');setTimeout(()=>slot.classList.remove('sent'),600);
}
// The fast lane (2026-11-27, "jumpy and glitchy"): moves no longer wait for each answer. The finger's total since the
// pad opened goes out once per screen refresh, up to 4 on the way at once; Aang sends each on to the laptop as one UDP
// packet and the laptop glides the pointer there. A lost or late one costs nothing (the next carries the total).
// Old Aang (no /api/mv): back to one move at a time.
const lane={s:0,n:0,x:0,y:0,sx:0,sy:0,out:0,raf:0,slow:false};
function tpMove(dx,dy){
  if(lane.slow){tp.dx+=dx;tp.dy+=dy;tpFlush();return}
  lane.x+=dx;lane.y+=dy;if(!lane.raf)lane.raf=requestAnimationFrame(laneSend)}
function laneSend(){
  lane.raf=0;if(!tp.el||lane.x===lane.sx&&lane.y===lane.sy)return;
  if(lane.out>=4){lane.raf=requestAnimationFrame(laneSend);return}
  lane.sx=lane.x;lane.sy=lane.y;lane.out++;
  fetch('/api/mv',{method:'POST',headers:{'x-omashu':'1','Content-Type':'application/json'},body:JSON.stringify({s:lane.s,n:++lane.n,x:Math.round(lane.x*100)/100,y:Math.round(lane.y*100)/100})})
    .then(r=>{const no=tp.el&&tp.el.querySelector('.tpno');
      if(r.status===404||r.status===405){lane.slow=true;tp.dx+=lane.x-lane.sx;tp.dy+=lane.y-lane.sy;return}
      if(no)no.textContent=r.ok?'':r.status===409?'WoW isn’t in front':'Not reaching the laptop'})
    .catch(()=>{const no=tp.el&&tp.el.querySelector('.tpno');if(no)no.textContent='Not reaching the laptop'})
    .finally(()=>{lane.out--})}
function openPad(into){if(tp.el||!into)return;tp.on=true;
  lane.s=(Math.random()*4294967295)>>>0;lane.n=0;lane.x=lane.y=lane.sx=lane.sy=0;
  const el=$('div','tpad inwell');
  el.innerHTML=`${[1,2,3,4].map(n=>`<div class="corner c${n}"><i></i><i></i><i></i></div>`).join('')}<div class="put">${PX_CHEV}</div>
  <div class="rail"><label class="slot">${PX_LENS}<input type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="60"></label>
  <div class="lev"><div class="ic a">${PX_PAD}</div><div class="ic b">${PX_PTR}</div><div class="hub"></div><div class="arm"></div></div></div>
  <div class="trail"><label class="tslot">${PX_PEN}<input type="text" enterkeyhint="enter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="200"></label>
  <div class="key" data-k="tab">${PX_TAB}</div><div class="key" data-k="enter">${PX_ENT}</div></div>
  <div class="sugg"></div><div class="surf"><div class="tpno"></div></div><div class="bars"><div class="bar" data-b="l"></div><div class="bar" data-b="r"></div></div>`;
  into.appendChild(el);tp.el=el;
  el.querySelector('.put').addEventListener('click',()=>{knock();closePad()});
  const L=el.querySelector('.lev');L.addEventListener('click',()=>throwLever(L));
  const i=el.querySelector('.slot input');
  i.addEventListener('focus',()=>{el.classList.add('kb');loadItems();drawSugg()});
  i.addEventListener('blur',()=>setTimeout(()=>{if(!tp.el||document.activeElement===i||ahBusy)return;el.classList.remove('kb');drawSugg();settle()},300));
  i.addEventListener('input',drawSugg);
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ahSearch(i.value)}});
  const ti=el.querySelector('.tslot input');
  ti.addEventListener('focus',()=>el.classList.add('kb'));
  ti.addEventListener('blur',()=>setTimeout(()=>{if(!tp.el||document.activeElement===ti)return;el.classList.remove('kb');settle()},300));
  ti.addEventListener('input',()=>tyInput(ti));
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tyKey('enter')}});
  el.querySelectorAll('.key').forEach(k=>{   // pressed without taking the keyboard away from the slot
    k.addEventListener('pointerdown',e=>{e.preventDefault();k.classList.add('down')});
    const off=()=>k.classList.remove('down');k.addEventListener('pointercancel',off);
    k.addEventListener('pointerup',e=>{e.preventDefault();off();tyKey(k.dataset.k)})});
  el.querySelectorAll('.bar').forEach(b=>{
    const up=e=>{if(!b.classList.contains('down'))return;b.classList.remove('down');tpPush({b:b.dataset.b,d:false})};
    b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('down');knock();tpPush({b:b.dataset.b,d:true})});
    b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
  const surf=el.querySelector('.surf');
  surf.addEventListener('pointerdown',e=>{e.preventDefault();surf.setPointerCapture(e.pointerId);
    const t={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:performance.now(),tl:performance.now(),dot:$('div','touch')};
    t.dot.style.left=e.clientX-surf.getBoundingClientRect().left+'px';t.dot.style.top=e.clientY-surf.getBoundingClientRect().top+'px';surf.appendChild(t.dot);
    tp.touches.set(e.pointerId,t);
    if(tp.touches.size===2)tp.two={t0:performance.now(),moved:0,acc:0};
    if(tp.touches.size===1)tp.vel=0});
  surf.addEventListener('pointermove',e=>{const t=tp.touches.get(e.pointerId);if(!t)return;
    const now=performance.now(),mx=e.clientX-t.x,my=e.clientY-t.y,dt=Math.max(1,now-t.tl);t.x=e.clientX;t.y=e.clientY;t.tl=now;
    const r=surf.getBoundingClientRect();t.dot.style.left=e.clientX-r.left+'px';t.dot.style.top=e.clientY-r.top+'px';
    if(tp.touches.size===1){const v=Math.hypot(mx,my)/dt;tp.vel=tp.vel*0.6+v*0.4;const g=tpGain(tp.vel);tpMove(mx*g,my*g)}
    else if(tp.two){tp.two.moved+=Math.abs(my)+Math.abs(mx);tp.two.acc+=my/2;   // two fingers: scroll (each finger moves it half)
      const n=Math.trunc(tp.two.acc/TP.scrollPt);if(n){tp.two.acc-=n*TP.scrollPt;tpPush({w:n})}}});
  const lift=e=>{const t=tp.touches.get(e.pointerId);if(!t)return;tp.touches.delete(e.pointerId);t.dot.remove();
    const now=performance.now();
    if(tp.two){if(tp.touches.size===0){if(now-tp.two.t0<TP.twoMs+150&&tp.two.moved<TP.tapPt*2){knock();tpPush({b:'r',d:true});tpPush({b:'r',d:false})}tp.two=null}return}
    if(now-t.t0<TP.tapMs&&Math.hypot(t.x-t.x0,t.y-t.y0)<TP.tapPt){knock();tpPush({b:'l',d:true});tpPush({b:'l',d:false})}};
  surf.addEventListener('pointerup',lift);surf.addEventListener('pointercancel',lift);
  lev.want=null;drawRail();
  tpPush({dx:1,dy:0});tpPush({dx:-1,dy:0});   // a small nudge: WoW shows its pointer once the mouse moves
}
// Put away: the pad closes and the laptop parks the pointer off the TV (and lets go of any held button). Leaving the
// app or locking the phone does the same (Joshua 2026-11-27); then the page may be frozen any moment, so that park
// goes out on its own as a keepalive request instead of waiting in the pad's line.
function closePad(leaving){if(!tp.el)return;tp.el.remove();tp.el=null;tp.on=false;tp.touches.clear();tp.two=null;tp.w=0;tp.dx=tp.dy=0;tp.ev.length=0;
  if(!leaving){tpPush({park:true});return}
  try{fetch('/api/mouse',{method:'POST',keepalive:true,headers:{'x-omashu':'1','Content-Type':'application/json'},body:'{"park":true}'})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)closePad(true);else if(home.page==='pad'&&home.well&&!tp.el)openPad(home.well)});
addEventListener('pagehide',()=>closePad(true));

// ---------- staying in step with Aang ----------
let pollT=0,polling=false;
async function poll(){
  if(polling)return;polling=true;clearTimeout(pollT);
  try{
  const after=chat.lines.length?chat.lines[chat.lines.length-1].seq:0;
  const {ok,j}=await api(`/api/poll?after=${after}&session=${encodeURIComponent(chat.session||'')}`);
  if(ok){
    if(performance.now()>S.heldUntil){const want=j.fire==='lit'||j.fire==='waking'?1:0;if(!S.known){S.known=true;S.lv=want}if(want!==S.target){S.target=want;if(want===0)S.touch=null}}
    const was=chat.on;chat.on=!!j.chat;if(chat.on&&!was)closeSheet();if(!chat.on&&tp.el)closePad();
    if(!chat.on){chat.ah=false;chat.ahWin=null;chat.typing=false;chat.danger=[];chat.zone=null;if(was){closeHome();chat.lines=[];chat.session=null;chat.whispers=0;chat.seen={}}}
    else{
      const newSession=j.session!==chat.session;if(newSession){chat.session=j.session;chat.lines=[];chat.seen={};chat.chans={}}
      if(j.lines&&j.lines.length){const fresh=!chat.lines.length;
        for(const l of j.lines)if(chat.emoteAt>performance.now()&&l.kind==='system'&&l.text[0]&&/^You /.test(l.text[0].s||'')){l.em=performance.now()+4000;chat.emoteAt=0}
        chat.lines.push(...j.lines);
        if(fresh)chat.seen=W.initSeen(chat.lines,j.whispers||0);   // counts start from now, not from the backlog (but Aang's unread whispers stay unread)
if(chat.lines.length>2000)chat.lines.splice(0,chat.lines.length-2000);
        for(const l of j.lines)if(l.chan)chat.chans[l.chan.num]=l.chan.name}
      chat.whispers=j.whispers||0;
      // the auction house and which window is up: the mouse pad's search slot and lever (sheet 21)
      const ah=!!j.ah;chat.ahWin=ah&&(j.ahWin==='improved'||j.ahWin==='game')?j.ahWin:null;if(ah!==chat.ah){chat.ah=ah;if(ah)loadItems()}chat.typing=j.typing===true;if(tp.el)drawRail();
      const gChanged=JSON.stringify(j.guild??null)!==JSON.stringify(chat.guild);chat.guild=j.guild??null;if(gChanged&&rosterEl)drawRoster();
      // danger in his zone (sheet 27): Aang keeps the last 15 minutes of LocalDefense trouble for the zone he is in
      chat.danger=Array.isArray(j.danger)?j.danger:[];chat.zone=j.zone||null;
      const dz=JSON.stringify([chat.danger,chat.zone]);if(dz!==chat.dz){chat.dz=dz;drawHead();drawNow()}else drawNow();
      if(j.lines&&j.lines.length||!was||newSession)render(newSession)}
    takeBook(chat.on?j.book:null);setCoin();
    place();
  }
  }finally{polling=false;pollT=setTimeout(poll,document.hidden?5000:tp.el?700:1500)}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
poll();
loadEmotes();
