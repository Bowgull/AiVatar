<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The phone fire remote for Omashu (built from approved mockups 02, 06, 07, 27 and 28 C, mockups/omashu/remote/). Served by
     src/Core/src/omashuremote.ts. The drawing part is sheet 02's own code, unchanged. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fire">
<link rel="apple-touch-icon" href="/fire-icon-180.png">
<meta name="theme-color" content="#010204">
<title>Fire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Figtree:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--wood-dark:#120803;--wood:#71401f;--wood-hi:#c27a3e;--parch:#f0e2bf;--parch-line:#d9c391;--brown:#3a2212;
  --c-guild:#40ff40;--c-party:#aaaaff;--c-whisper:#ff80ff;--c-general:#ffc0c0;--c-say:#ffffff;--c-sys:#ffff00;--c-item:#1eff00;--c-quest:#ffff00;--c-emote:#ff8040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#04060a;color:#efe6d2;font-family:"Pixelify Sans",system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}                          /* the page itself never scrolls, even when the keyboard opens */
#app{position:fixed;inset:0;overflow:hidden;background:#04060a;touch-action:none}
#app canvas.scene{position:absolute;image-rendering:pixelated}
/* the controls sheet: parchment on wood (sheet 02) */
.dim{position:absolute;inset:0;z-index:6;background:#000a}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;top:118px;z-index:7;background:var(--parch);
  border:6px solid var(--wood);box-shadow:0 0 0 3px var(--wood-hi) inset,0 0 0 3px var(--wood-dark),0 -10px 40px #000c;
  border-radius:18px;padding:16px 14px 14px;color:var(--brown);display:flex;flex-direction:column;overflow-y:auto}
.sheet h3{font-weight:600;font-size:22px;margin:0 2px 2px;color:var(--wood-dark)}
.sheet .grip{width:48px;height:6px;border-radius:3px;background:var(--parch-line);margin:-6px auto 10px}
.sheet table{width:100%;border-collapse:collapse;font-size:15px}
.sheet td{padding:6px 4px;border-bottom:2px dotted var(--parch-line);vertical-align:middle}
.sheet td.g{width:62px;text-align:center}
.sheet td.s{width:52px;text-align:right;color:#8a6a44;font-size:13px;white-space:nowrap}
.sheet .does{font-weight:600;color:var(--wood-dark)}
.sheet .hint{color:#7a5a3a;font-size:13px}
.sheet .new{color:#2f7d5b}
.btn{display:inline-block;min-width:34px;padding:5px 6px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--parch);
  background:var(--wood);box-shadow:inset 0 -3px 0 var(--wood-dark);text-align:center}
.btn.a{background:#3f8f47}.btn.b{background:#b5413a}.btn.x{background:#3a66b0}.btn.y{background:#c08a1e}
.btn.w{min-width:52px;font-size:12px}
svg.gl{width:40px;height:33px;display:block;margin:0 auto}
svg.ic{width:34px;height:34px;display:block;margin:0 auto}
.sheet .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;font-size:13px;color:#7a5a3a}
.roster{flex:none;max-height:45%;overflow-y:auto;background:#1a120b;border-radius:10px;box-shadow:inset 0 0 0 2px #3a2614;margin:0 0 8px;padding:8px 8px 6px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:pan-y}
.roster .hd{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:0 4px 6px;cursor:pointer}
.roster .hd b{color:var(--c-guild);font-weight:600}
.roster .hd span{color:#b39b73;font-size:13px}
.roster.folded{padding:9px 12px}
.roster.folded .hd{padding:0}
.mem{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1.1fr);gap:8px;align-items:center;padding:7px 6px;border-top:1px solid #2a1a0e;font-size:15px;cursor:pointer}
.mem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .lv{text-align:right;color:#ffd36b;font-variant-numeric:tabular-nums}
.mem .zn{color:#b39b73;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem.hl{background:#ffffff14;border-radius:7px}
/* whispers (sheet 12): the last 4 people, then one person's last 6 lines */
.log{flex:1;min-height:0;background:#0d0a07;border-radius:10px;box-shadow:inset 0 0 0 2px #2a1a0e,inset 0 3px 10px #000;
  padding:10px 10px;overflow-y:auto;font-size:15px;line-height:1.38;display:flex;flex-direction:column;gap:5px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  touch-action:pan-y;-webkit-user-select:text;user-select:text}
.log>:first-child{margin-top:auto}
.l{color:var(--c-say);overflow-wrap:anywhere}
.t{color:#8a7b63;font-size:12px;margin-right:5px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}   /* Pixelify mangles small digits (Joshua 2026-11-10) */
.l .who,.l .ch,.l .lk{cursor:pointer}
.g{color:var(--c-guild)} .p{color:var(--c-party)} .w{color:var(--c-whisper)} .gen{color:var(--c-general)} .sys{color:var(--c-sys)} .em{color:var(--c-emote)}
.o{color:#40c040} .r{color:#ff7f00} .yl{color:#ff4040}
.item{color:var(--c-item)} .quest{color:var(--c-quest)} .spell{color:#71d5ff}
.q0{color:#9d9d9d}.q1{color:#fff}.q2{color:#1eff00}.q3{color:#0070dd}.q4{color:#a335ee}.q5{color:#ff8000}.q6{color:#e6cc80}.q7{color:#00ccff}
.l.hl{background:#ffffff14;border-radius:6px;margin:0 -4px;padding:0 4px}
.l.new{background:#ff804022;border-radius:6px;margin:0 -4px;padding:0 4px}
.send{margin-top:8px;display:flex;gap:6px;align-items:stretch}
.box{flex:1;min-width:0;background:#fffaf0;border:0;outline:0;border-radius:10px;box-shadow:inset 0 0 0 2px var(--parch-line);padding:9px 10px;color:#2a1a0e;font-size:16px;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:text;user-select:text}
.box::placeholder{color:#7a6448}
.emo{flex:none;width:44px;border-radius:10px;background:var(--wood);box-shadow:inset 0 -3px 0 var(--wood-dark);display:flex;align-items:center;justify-content:center}
.emo.on{background:var(--wood-dark);box-shadow:inset 0 0 0 2px var(--wood-hi)}
.emo svg{width:24px;height:24px}
.go{flex:none;width:46px;border-radius:10px;background:#3f8f47;box-shadow:inset 0 -3px 0 #1f4f27;display:flex;align-items:center;justify-content:center}
.go svg{width:20px;height:20px}
/* name menu (and the channel picker, the same wood menu) */
.mdim{position:absolute;inset:0;z-index:6;background:#000a}
.menu{position:absolute;z-index:7;left:44px;right:44px;top:330px;background:var(--wood);border-radius:14px;
  box-shadow:0 0 0 3px var(--wood-dark),inset 0 0 0 3px var(--wood-hi),0 14px 40px #000;padding:12px 10px 10px;max-height:calc(100% - 80px);overflow-y:auto}
.menu h4{margin:0 6px 8px;font-size:18px;color:#ffd36b}
.menu h4 span{display:block;color:#e4c9a0;font-size:13px;font-weight:400;margin-top:3px;font-family:system-ui,-apple-system,sans-serif}
.mi{background:#3a2212;color:var(--parch);border-radius:9px;padding:11px 12px 10px;margin:5px 0;font-size:16px;box-shadow:inset 0 -2px 0 #24140a;display:flex;justify-content:space-between}
.mi small{color:#b39b73;font-size:12px}
.menu .yes{display:block;text-align:center;margin:10px 0 2px;padding:16px 12px 14px;border-radius:11px;font-size:22px;font-weight:600;color:#2a1604;
  background:linear-gradient(#f3d784,#c9973a);box-shadow:inset 0 -3px 0 #8a5a17,inset 0 2px 0 #fff3c4,0 2px 0 #24140a}
.menu .yes:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 #8a5a17,inset 0 2px 0 #fff3c4}
.menu .no{display:block;text-align:center;margin:8px auto 2px;padding:8px 18px;font-size:14px;color:#e4c9a0;opacity:.85}
/* the emote tray: wooden tiles, 3 by 3 (sheet 07) */
.tray{margin-top:8px;background:var(--wood);border-radius:12px;box-shadow:0 0 0 2px var(--wood-dark),inset 0 0 0 2px var(--wood-hi);padding:8px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tray .tile{padding:13px 2px 12px}
.tray .tile.more,.tray .swaphint{grid-column:1/-1}
.swaphint{text-align:center;color:#ffd36b;font-size:15px;font-weight:600;padding:10px 4px 9px}
.tile.pick{animation:pick 1.1s ease-in-out infinite}
@keyframes pick{50%{box-shadow:inset 0 -3px 0 #24140a,0 0 0 2px #ffd36bcc}}
.tile.fav::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;background:#ffd36b;clip-path:polygon(50% 0,63% 35%,100% 38%,70% 61%,80% 100%,50% 78%,20% 100%,30% 61%,0 38%,37% 35%)}
.tile{position:relative;-webkit-touch-callout:none}
.tile.blank{background:none;box-shadow:none;pointer-events:none;min-height:45px}
.tile{background:#3a2212;color:var(--parch);border-radius:9px;padding:12px 4px 11px;text-align:center;font-size:16px;font-weight:600;box-shadow:inset 0 -3px 0 #24140a;
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tile.down{background:#24140a;box-shadow:inset 0 2px 0 #120803;color:#ffd36b}
.tile.more{background:#e4d1a3;color:var(--brown);box-shadow:inset 0 -3px 0 #c9b07a}
.tile svg{width:18px;height:18px;flex:none}
/* More: every group on one page */
.emsheet{flex:none;margin-top:8px;display:flex;flex-direction:column;background:var(--wood);border-radius:12px;box-shadow:0 0 0 2px var(--wood-dark),inset 0 0 0 2px var(--wood-hi);padding:8px}
.esearch{display:block;width:100%;margin:0 0 7px;background:#fffaf0;border:0;outline:0;border-radius:9px;box-shadow:inset 0 0 0 2px var(--parch-line);padding:8px 10px;font:16px system-ui,-apple-system,sans-serif;color:#2a1a0e;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
.esearch::placeholder{color:#7a6448}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 9px 5px;border-radius:9px;background:#e4d1a3;color:var(--brown);font-size:14px;font-weight:600;box-shadow:inset 0 -2px 0 #c9b07a}
.chip.on{background:var(--wood-hi);color:#fff4dc;box-shadow:inset 0 -3px 0 #7a4a20}
.enote{font-size:13px;color:#e4c9a0;margin:8px 4px 0}
.emsheet .head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;color:#ffd36b;font-size:18px;font-weight:600}
.emsheet .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.emsheet .gh{color:#ffd36b;font-size:14px;font-weight:600;margin:10px 4px 5px}.emsheet .gh:first-child,.emsheet .head+.gh{margin-top:2px}
.emsheet .tile{font-size:15px;padding:14px 2px 13px}
/* emotes aimed at a name */
.at{margin:10px 6px 4px;color:#e4c9a0;font-size:13px}
.menu .tray{margin:0;padding:0;background:none;box-shadow:none;grid-template-columns:repeat(4,1fr);gap:5px}
.menu .tile{font-size:14px;padding:10px 2px 9px}
.menu.name{top:250px}
/* sideways: the chat goes wide; the emotes slide in on the right when the smiley is tapped */
.cols{flex:1;min-height:0;display:flex;gap:8px}
.cols .left{flex:1;min-width:0;display:flex;flex-direction:column}
.cols .right{flex:none;width:262px;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.side .tray{margin:0;flex:1;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);align-content:stretch}
.side .tray .tile{padding:0 2px}
.side .emsheet{margin:0;flex:1;min-height:0;overflow-y:auto}
.side .tray .tile{font-size:14px}
.side.typing .tabs{display:none}
.side .menu,.side .menu.name{top:8px;left:calc(50% - 190px);right:calc(50% - 190px);max-height:calc(100% - 16px)}
.side .tip{top:20px}
/* WoW tooltip */
.tip{position:absolute;z-index:7;left:34px;right:34px;top:250px;background:#06081acc;border:2px solid #9aa0b8;border-radius:6px;
  box-shadow:0 0 0 1px #000,0 14px 40px #000;padding:12px 14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;color:#fff}
.tip .nm{color:var(--c-item);font-size:17px;font-weight:600}
.tip .q,.tip .y{color:#ffd100}.tip .gr{color:#1eff00}.tip .gy{color:#a0a0a0}
.tip .two{display:flex;justify-content:space-between;gap:10px}
.tip .fine{margin-top:10px;font-family:"Pixelify Sans";font-size:12px;color:#8a8aa0}
/* review before send */
.l.pend{opacity:.45;font-style:italic}
.send{position:relative}
.send .hint{position:absolute;left:96px;bottom:-18px;font:13px "Pixelify Sans";color:#e0675d;text-shadow:0 1px 0 #000}
.review{margin-top:8px;background:#fffaf0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--parch-line);padding:10px 12px 12px;color:#2a1a0e;font-size:16px;font-family:system-ui,-apple-system,sans-serif;overflow-wrap:anywhere}
.review .to{font-family:"Pixelify Sans";font-size:13px;color:#7a5a3a;margin-bottom:4px}
.review .to.bad{color:#b5413a}
.rb{display:flex;gap:8px;margin-top:10px}
.rb div{flex:1;text-align:center;padding:10px 0 9px;border-radius:10px;font-family:"Pixelify Sans";font-weight:600;font-size:16px}
.rb .no{background:#e4d1a3;color:var(--brown);box-shadow:inset 0 -2px 0 #c9b07a}
.rb .yes{background:#3f8f47;color:#fff;box-shadow:inset 0 -3px 0 #1f4f27}
/* ---------- iPhone size pass (Joshua 2026-11-13: "an entire pass ... for visibility and clickability") ----------
   One set of sizes for everything, from Apple's rules: body text 17 (rem follows the iPhone's own Text Size setting),
   nothing under 13, everything you tap at least 44 x 44, rows 52, every text colour 4.5:1 on its background. */
:root{--tap:44px;--row:52px;--fs-body:1rem;--fs-sub:.882rem;--fs-label:.941rem;--fs-fine:.765rem;--fs-title:1.06rem;
  --dim-text:#b8a682;--quiet-text:#9a8a6c}
html{font-size:17px}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
html,body{font-family:"Pixelify Sans",system-ui,sans-serif}
/* chat */
.log{font-size:var(--fs-body);line-height:1.36;gap:6px;padding:10px 12px}
.t{font-size:var(--fs-fine);color:var(--dim-text)}
.l.hl,.l.new{margin:0 -6px;padding:2px 6px}
.send{gap:6px;margin-top:8px}
.emo,.go{min-height:var(--tap);width:var(--tap)}
.emo svg{width:26px;height:26px}.go svg{width:22px;height:22px}
.box{min-height:var(--tap);min-width:38%;font-size:max(16px,var(--fs-body));padding:0 10px}
.send .hint{font-size:var(--fs-fine);bottom:-20px;left:12px}
/* guild roster */
.roster .hd{min-height:var(--tap);font-size:var(--fs-label);padding:0 6px}
.roster .hd span{font-size:var(--fs-sub)}
.roster.folded{padding:0 8px}
.mem{min-height:var(--row);font-size:var(--fs-body);padding:8px 6px}
.mem .zn{font-size:var(--fs-sub);color:#c9b48a}
/* menus */
.menu,.menu.name{left:20px;right:20px;top:auto;bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 10px));padding:14px 12px 12px;max-height:calc(100% - 70px)}
.side .menu,.side .menu.name{bottom:auto}   /* menus rise from the bottom, where the thumb is; sideways keeps its own place */
.menu h4{font-size:1.18rem}
.menu h4 span{font-size:var(--fs-sub)}
.mi{min-height:48px;align-items:center;font-size:var(--fs-body);padding:0 14px}
.mi small{font-size:var(--fs-fine);color:#c9ad80}
.menu .no{min-height:var(--tap);display:flex;align-items:center;justify-content:center;font-size:var(--fs-label)}
.at{font-size:var(--fs-sub)}
/* emotes */
.tile{min-height:48px;font-size:var(--fs-label)}
.tray .tile{padding:0 2px}
.menu .tile{min-height:var(--tap);font-size:var(--fs-sub);padding:0 2px}
.emsheet .tile{min-height:48px;font-size:var(--fs-sub);padding:0 2px}
.tile.blank{min-height:48px}
.swaphint{font-size:var(--fs-label)}
.esearch{min-height:var(--tap);font-size:max(16px,var(--fs-body))}
.chip{min-height:var(--tap);padding:0 13px;font-size:var(--fs-sub);display:inline-flex;align-items:center}
.enote{font-size:var(--fs-sub)}
.emsheet .head{font-size:1.06rem}.emsheet .gh{font-size:var(--fs-sub)}
/* tooltip, review */
.tip{font-size:var(--fs-label)}.tip .nm{font-size:1.06rem}.tip .fine{font-size:var(--fs-fine);color:#a8a8c0}
.review{font-size:var(--fs-body)}.review .to{font-size:var(--fs-sub)}
.rb div{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-body)}
/* the controls sheet (look, don't tap) */
.sheet table{font-size:var(--fs-body)}.sheet td.s,.sheet .hint,.sheet .foot{font-size:var(--fs-sub)}.btn{font-size:var(--fs-sub)}.btn.w{font-size:var(--fs-fine)}
/* every tap shows it landed: a little darker and smaller while your thumb is down (an iPhone page can't buzz) */
.tab,.chan,.emo,.go,.back,.mi,.tile,.chip,.mem,.who-row,.roster .hd,.rb div,.menu .no{transition:transform .08s,filter .08s}
.tab:active,.chan:active,.emo:active,.go:active,.back:active,.mi:active,.tile:active,.chip:active,.mem:active,.who-row:active,.roster .hd:active,.rb div:active,.menu .no:active{filter:brightness(.82);transform:scale(.97)}
.mg{color:#ffd100}.ms{color:#c7c7cf}.mc{color:#d58a4a}
.q2{color:#1eff00!important}.q3{color:#0070dd!important}.q4{color:#a335ee!important}.q0{color:#9d9d9d!important}
/* the mouse pad (sheet 21 v3, 2026-11-27): a leather mat in the wood frame, stitched, brass corners, a felt pad and two
   click bars with no words. At the auction house a search slot and the window lever sit along the top. The brass tab
   on top puts it away (the pointer leaves the TV); so does leaving the app. */
.tpad{position:absolute;left:10px;right:10px;top:max(22px,calc(env(safe-area-inset-top) + 8px));bottom:max(14px,env(safe-area-inset-bottom));z-index:8;border-radius:26px;padding:26px 14px 14px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(ellipse at 50% 30%,#3a2516 0%,#24160c 60%,#1a0f08 100%);box-shadow:0 0 0 6px var(--wood),0 0 0 9px var(--wood-dark),inset 0 0 0 2px #120803,0 -10px 40px #000a;animation:tpin .22s ease-out}
@keyframes tpin{from{transform:translateY(12px);opacity:.6}}
.tpad::before{content:"";position:absolute;inset:7px;border-radius:20px;border:2px dashed #6a4a2a;opacity:.55;pointer-events:none}
.tpad .corner{position:absolute;width:18px;height:18px;pointer-events:none}
.tpad .corner i{position:absolute;background:#c8962e;box-shadow:inset 0 -2px 0 #6a4a1a}
.tpad .c1{left:4px;top:4px}.tpad .c2{right:4px;top:4px;transform:scaleX(-1)}.tpad .c3{left:4px;bottom:4px;transform:scaleY(-1)}.tpad .c4{right:4px;bottom:4px;transform:scale(-1)}
.tpad .corner i:nth-child(1){left:0;top:0;width:18px;height:6px}.tpad .corner i:nth-child(2){left:0;top:0;width:6px;height:18px}.tpad .corner i:nth-child(3){left:6px;top:6px;width:6px;height:6px}
svg.px{shape-rendering:crispEdges}
.tpad .put{position:absolute;left:50%;top:-15px;width:84px;height:34px;margin-left:-42px;border-radius:0 0 12px 12px;z-index:3;display:grid;place-items:center;
  background:linear-gradient(#e0b04a,#a8761e);box-shadow:0 0 0 3px #3a1a08,inset 0 -5px 0 #6a4a1a,inset 0 2px 0 #fff3c0,0 4px 10px #000a;transition:transform .08s,box-shadow .08s}
.tpad .put svg{width:32px;height:32px;margin-top:2px}
.tpad .put:active{transform:translateY(3px);box-shadow:0 0 0 3px #3a1a08,inset 0 -2px 0 #6a4a1a,inset 0 2px 0 #fff3c0,0 1px 4px #000a}
.tpad .rail{display:none;gap:10px;position:relative;z-index:1}
.tpad.at-ah .rail{display:flex}
/* sheet 24: a WoW text box has the cursor (mail, trade, bank) -> the type slot with Tab and Enter takes the rail */
.tpad .trail{display:none;gap:8px;position:relative;z-index:1}
.tpad.typing .trail{display:flex}.tpad.typing .rail{display:none}

.tpad .slot:focus-within{box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #ffd36b88,0 0 14px #ffd36b33}
.tpad .slot.no{box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #b5413a}
.tpad .slot.sent{box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #ffd36b,0 0 18px #ffd36b66}
.tpad .lev{position:relative;width:156px;height:60px;border-radius:10px;flex:none;background:linear-gradient(#3a2412,#24160c);box-shadow:inset 0 0 0 2px #c8962e,inset 0 0 0 4px #24140a,0 3px 0 #0a0503}

.tpad .lev .arm{position:absolute;left:74px;bottom:10px;width:8px;height:32px;border-radius:4px;background:linear-gradient(90deg,#8a6a2a,#ffd36b,#8a6a2a);transform-origin:50% 100%;transform:rotate(-34deg);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tpad .lev .arm::after{content:"";position:absolute;left:-5px;top:-8px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3c0,#ffb84a 45%,#8a4214 80%);box-shadow:0 0 10px #ffd36b88}
.tpad .lev .hub{position:absolute;left:68px;bottom:5px;width:20px;height:9px;border-radius:4px 4px 2px 2px;background:#6a4a1a;box-shadow:inset 0 2px 0 #c8962e}
.tpad .lev.b .arm{transform:rotate(34deg)}
.tpad .lev.no{box-shadow:inset 0 0 0 2px #b5413a,inset 0 0 0 4px #24140a,0 3px 0 #0a0503}
.tpad .sugg{display:flex;flex-direction:column;gap:5px;z-index:1}
.tpad .sugg:empty{display:none}
.tpad .sg img{width:30px;height:30px;border-radius:5px;box-shadow:0 0 0 2px #000;flex:none}
.tpad .hdr{font:12px "Pixelify Sans";color:#8a7b63;letter-spacing:.6px;margin:0 2px -1px}
.tpad .sg .top{display:flex;align-items:center;gap:9px;min-height:44px}
.tpad .sg .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpad .sg .pr{font:700 14px Figtree,system-ui,sans-serif;text-align:right;line-height:1.15;flex:none;color:#f0e2bf}
.tpad .sg .pr .u{display:block;font:400 11px Figtree,system-ui,sans-serif;color:#8a7b63}
.tpad .sg .pr .tag{font:600 11px "Pixelify Sans";margin-left:4px}
.tpad .sg.cheap{box-shadow:inset 0 0 0 2px #3c8f3a!important}.tpad .sg.cheap .tag{color:#7ae05a}.tpad .sg.dear .tag{color:#ff9a7a}
.tpad .sg.open{box-shadow:inset 0 0 0 2px #ffd36b88}
.tpad .cg{color:#ffd700}.tpad .cs{color:#c7c7cf}.tpad .cc{color:#e08a4a}
.tpad .chart{margin:2px 0 6px;height:64px;border-radius:8px;background:#0a0503;box-shadow:inset 0 0 0 1px #3a2412;position:relative}
.tpad .chart svg{position:absolute;left:8px;right:8px;top:6px;bottom:16px;width:calc(100% - 16px);height:calc(100% - 22px)}
.tpad .chart .ax{position:absolute;left:8px;right:8px;bottom:2px;display:flex;justify-content:space-between;font:10px Figtree,system-ui,sans-serif;color:#6a5a40}
.tpad .sg{display:block;background:#120a05;border-radius:10px;padding:2px 10px;box-shadow:inset 0 0 0 2px #3a2412;font:600 16px Figtree,system-ui,sans-serif}
.tpad .sg:active,.tpad .sg.down{box-shadow:inset 0 0 0 2px #ffd36b88}
.tpad .surf{flex:1;min-height:0;border-radius:16px;position:relative;overflow:hidden;z-index:1;touch-action:none;
  background:radial-gradient(ellipse at 50% 40%,#1c130c,#0d0805 75%);box-shadow:inset 0 0 0 2px #0a0503,inset 0 0 0 4px #5a3a18,inset 0 6px 22px #000}
.tpad .surf::after{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;background-image:radial-gradient(#6a4a2a 1px,transparent 1px);background-size:5px 5px}
.tpad .touch{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(#ffd36b4a,#ffd36b00 70%);box-shadow:0 0 0 2px #ffd36b55;pointer-events:none}

.tpad .bars{display:flex;height:70px;flex:none;border-radius:14px;overflow:hidden;z-index:1;box-shadow:0 0 0 2px #0a0503,0 0 0 4px #5a3a18,0 4px 0 4px #0a0503}
.tpad .bar{flex:1;background:linear-gradient(#4a2c16,#331d0e);box-shadow:inset 0 -6px 0 #1e1008,inset 0 2px 0 #6a4424;touch-action:none}

.tpad .bar.down{background:linear-gradient(#24140a,#2e1a0c);box-shadow:inset 0 5px 0 #0a0503,inset 0 0 18px #ffd36b33}
.tpad.kb{bottom:auto;box-shadow:0 0 0 6px var(--wood),0 0 0 9px var(--wood-dark),inset 0 0 0 2px #120803,0 0 0 100vmax #000d}.tpad.kb .surf,.tpad.kb .bars{display:none}   /* typing: the rest of the screen dims, nothing under it to hit */
@media (prefers-reduced-motion:reduce){.tpad{animation:none}.tpad .tslot{animation:none}.tpad .lev .arm,.tpad .lev .ic,.tpad .slot{transition:none}}
/* ---------- the WoW home (sheets 27 and 28 C, approved 2026-11-27): one coin on the campfire opens one home with a bar
   of wood keys along the bottom, Now · Chat · Pad · Book. Lifted from the mockups; arrive 300 ms on the arrive curve,
   leave 160 ms, pages fade in 220 ms, chat pages push 280 ms (back 160 ms). ---------- */
:root{--arrive:cubic-bezier(.32,.72,0,1);--leave:cubic-bezier(.5,0,.75,0);--spring:cubic-bezier(.3,1.4,.6,1);--hot:#ffd36b}
.wowcoin{position:absolute;width:66px;height:66px;z-index:3;display:none;border-radius:50%;cursor:pointer;place-items:center;
  background:radial-gradient(circle at 50% 38%,#c8762c,#8a4214 70%);box-shadow:0 0 0 3px #3a1a08,inset 0 -5px 0 #5a2a0a,0 0 22px #ffb84a55;animation:wcbr 2.8s ease-in-out infinite;transition:transform .08s}
.wowcoin.on{display:grid}.wowcoin:active{transform:scale(.95)}
.wowcoin .ic{display:grid;place-items:center}
.wowcoin img{width:40px;height:40px;border-radius:7px;box-shadow:0 0 0 2px #2a1205;display:block}
.wowcoin svg{width:32px;height:28px}
.wowcoin .lv{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font:600 13px "Pixelify Sans";color:#2a1405;background:var(--hot);border-radius:9px;padding:0 7px;box-shadow:0 0 0 2px #3a1a08}
.wowcoin .n{position:absolute;top:-6px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:#c8509a;color:#fff;font:600 13px "Pixelify Sans";display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #2a0a1a}
.wowcoin .dot{position:absolute;top:-2px;left:-4px;width:14px;height:14px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 2px #3a1a08,0 0 10px var(--hot)}
@keyframes wcbr{0%,100%{box-shadow:0 0 0 3px #3a1a08,inset 0 -5px 0 #5a2a0a,0 0 16px #ffb84a44}50%{box-shadow:0 0 0 3px #3a1a08,inset 0 -5px 0 #5a2a0a,0 0 30px #ffb84aaa}}
.whdim{position:absolute;inset:0;z-index:6;background:#000b;animation:whdi .3s var(--arrive)}
@keyframes whdi{from{opacity:0}}
.whdim.out{opacity:0;transition:opacity .16s var(--leave)}
.wh{position:absolute;left:10px;right:10px;top:max(56px,calc(env(safe-area-inset-top,0px) + 8px));bottom:max(14px,env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;z-index:7;
  background:#f1e4c3;border-radius:30px;box-shadow:0 0 0 7px #b8662c,0 0 0 10px #6a3412,0 -10px 40px #000a;display:flex;flex-direction:column;color:#2a1a0e;
  animation:whup .3s var(--arrive);touch-action:auto}
@keyframes whup{from{transform:translateY(16px);opacity:.5}}
.wh.out{transform:translateY(16px);opacity:0;transition:transform .16s var(--leave),opacity .16s var(--leave)}
.wh .grip{width:60px;height:6px;border-radius:3px;background:#c9b48a;margin:9px auto 7px;flex:none;position:relative;cursor:pointer}
.wh .grip::after{content:"";position:absolute;left:-40px;right:-40px;top:-12px;bottom:-10px}
.wh .head{display:flex;align-items:center;gap:10px;padding:0 14px 8px;flex:none;min-height:46px}
.wh .head img{width:38px;height:38px;border-radius:7px;box-shadow:0 0 0 2px #2a1205,0 0 0 4px #c8962e;flex:none}
.wh .hw{flex:1;min-width:0}
.wh .nm{font:700 16px Cinzel,serif;color:#3a2410;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wh .nm small{font:600 12px Figtree,system-ui;color:#b0487a}
.wh .sub{font:12.5px Figtree,system-ui;color:#7a6446;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .xp{height:7px;border-radius:4px;background:#d9c49a;margin-top:4px;overflow:hidden}.wh .xp i{display:block;height:100%;background:linear-gradient(90deg,#8a3ccf,#c87af0)}
.wh .well{flex:1;min-height:0;margin:0 10px;background:#0d0906;border-radius:16px;box-shadow:inset 0 0 0 3px #2a1a0e;padding:11px;overflow:auto;color:#f0e2bf;scrollbar-width:none;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.wh .well::-webkit-scrollbar{display:none}
/* sheet omashu/remote/29 (Joshua 2026-11-27): the brass Reload key, top right of the header on every page.
   Hold it: the gold ring fills in 500 ms, then WoW reloads. Let go early and the ring drains (160 ms). */
.wh .rl{--p:0;position:relative;width:46px;height:46px;flex:none;border-radius:50%;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:conic-gradient(#ffd36b calc(var(--p)*1turn),#5a3412 0);padding:3px;box-shadow:0 0 0 2px #2a1205}
.wh .rl .face{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#e0b04a,#a8701e 62%,#7a4a10);box-shadow:inset 0 -3px 0 #5a3208,inset 0 2px 0 #ffe9a866;transition:transform .06s}
.wh .rl.down .face{transform:translateY(1px);box-shadow:inset 0 -1px 0 #5a3208,inset 0 2px 0 #ffe9a866}
.wh .rl svg{width:24px;height:24px;shape-rendering:crispEdges;transition:transform .5s cubic-bezier(.3,1.4,.6,1)}
.wh .rl.fired{box-shadow:0 0 0 2px #2a1205,0 0 18px #ffd36b}
.wh .rl.fired .face{background:radial-gradient(circle at 50% 35%,#fff0b0,#ffd36b 55%,#c8962e)}
.wh .rl.fired svg{transform:rotate(360deg)}
.wh .rl.wait .face{animation:rlbr 2.8s ease-in-out infinite}
@keyframes rlbr{0%,100%{box-shadow:inset 0 -3px 0 #5a3208,0 0 0 #ffd36b00}50%{box-shadow:inset 0 -3px 0 #5a3208,0 0 14px #ffd36b99}}
@media (prefers-reduced-motion:reduce){.wh .rl svg{transition:none}.wh .rl.fired svg{transform:none}.wh .rl.wait .face{animation:none;box-shadow:inset 0 -3px 0 #5a3208,0 0 10px #ffd36b88}}
.wh .well.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.wh .hbar{flex:none;display:flex;gap:6px;padding:9px 12px 12px}
.wh .bk{flex:1;height:58px;border-radius:13px;background:#e7d8b4;box-shadow:inset 0 -4px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;
  font:600 11px "Pixelify Sans";color:#5a4028;transition:background .18s var(--arrive),transform .06s}
.wh .bk svg{width:26px;height:26px}
.wh .bk:active{transform:translateY(2px)}
.wh .bk.on{background:#2a1a0e;color:var(--hot);box-shadow:0 0 0 2px #c8962e,inset 0 -4px 0 #0006}
.wh .bk .n{position:absolute;top:4px;right:12px;min-width:18px;height:18px;border-radius:9px;background:#c8509a;color:#fff;font:600 11px "Pixelify Sans";display:grid;place-items:center;padding:0 4px}
.wh .bk .dot{position:absolute;top:7px;right:16px;width:9px;height:9px;border-radius:50%;background:var(--hot);box-shadow:0 0 6px var(--hot)}
.wh .pagefade{animation:whpf .22s var(--arrive)}@keyframes whpf{from{opacity:0;transform:translateY(4px)}}
/* Now */
.wh .k{font:12px "Pixelify Sans";color:#9a8f78;letter-spacing:.6px;margin:4px 2px 7px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.wh .k b{color:#c8b890;font-weight:400}
.wh .danger{display:flex;gap:10px;align-items:center;border-radius:12px;padding:9px 10px;margin-bottom:12px;background:linear-gradient(90deg,#3a1408,#22100a);box-shadow:inset 0 0 0 2px #ff8a5a88}
.wh .danger img{width:34px;height:34px;border-radius:6px;box-shadow:0 0 0 2px #000;flex:none}
.wh .danger .ti{font:600 15px Figtree,system-ui;color:#ffd0b8}.wh .danger .de{font:12px Figtree,system-ui;color:#c89a80;margin-top:1px;overflow-wrap:anywhere}
.wh .danger .ago{margin-left:auto;font:600 11px "Pixelify Sans";color:#ff9a7a;flex:none;text-align:right}
.wh .er{background:#1a120b;border-radius:12px;box-shadow:inset 0 0 0 2px #2a1a0e;padding:9px 10px;margin-bottom:7px}
.wh .er .top,.wh .dtc .top{display:flex;align-items:center;gap:9px}
.wh .er .top img.sw{width:34px;height:34px;border-radius:6px;box-shadow:0 0 0 2px #000;flex:none}
.wh .ti{font:600 15px Figtree,system-ui;color:#fff3d8;line-height:1.15}.wh .de{font:12px/1.35 Figtree,system-ui;color:#a8987a}
.wh .er .cost{margin-left:auto;font:600 14px Figtree,system-ui;color:#f0e2bf;flex:none}
.wh .spells{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.wh .spells img{width:32px;height:32px;border-radius:6px;box-shadow:0 0 0 2px #000,0 0 0 3px #c8962e}
.wh .it{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid #2a1a0e;cursor:pointer;min-height:46px}
.wh .it:first-child{border-top:0}
.wh .it img,.wh .noimg{width:34px;height:34px;border-radius:6px;box-shadow:0 0 0 2px #000;flex:none;background:#2a1a0e}
.wh .it .ti{flex:1;min-width:0;transition:color .3s,opacity .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .it .q{font:600 13px "Pixelify Sans";color:#c8b890}
.wh .tick{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 2px #6a4a2a;background:#120a05;display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.wh .tick svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
.wh .it.done .tick{background:#3a2a10;box-shadow:inset 0 0 0 2px var(--hot)}.wh .it.done .tick svg{opacity:1;transform:scale(1)}
.wh .it.done .ti{color:#7a6a50;text-decoration:line-through;text-decoration-color:#7a6a5088}
.wh .add{display:flex;align-items:center;gap:9px;margin-top:6px;padding:9px 10px;min-height:44px;border-radius:10px;background:#120a05;box-shadow:inset 0 0 0 2px #3a2412;font:600 14px Figtree,system-ui;color:#9a8f78;cursor:pointer}
.wh .add svg{width:20px;height:20px}
.wh .it:active,.wh .add:active{filter:brightness(.85)}
.wh .dtc{background:#1a120b;border-radius:12px;box-shadow:inset 0 0 0 2px #2a1a0e;padding:9px 10px;margin-bottom:8px}
.wh .dtc .top{gap:10px}
.wh .dtc img.rw{width:42px;height:42px;border-radius:7px;box-shadow:0 0 0 2px #000,0 0 0 3px #4a6aff88;flex:none}
.wh .dtc .rwn{font:600 13px Figtree,system-ui;color:#4a90ff}
.wh .dtc .de{margin-top:2px}
.wh .dtc .gain{margin-left:auto;text-align:right;flex:none;font:600 15px "Pixelify Sans";color:#2fdc3a}
.wh .dtc .gain small{display:block;font:11px "Pixelify Sans";color:#8a7b63}
.wh .pgo{margin-top:9px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font:600 14px "Pixelify Sans";color:#2a1405;background:linear-gradient(#e0b04a,#a8761e);box-shadow:inset 0 -4px 0 #6a4a1a,inset 0 2px 0 #fff3c0,0 0 0 2px #3a1a08;transition:transform .06s}
.wh .pgo:active{transform:translateY(2px)}
.wh .pgo.sent{background:#2a1c0e;color:var(--hot);box-shadow:inset 0 0 0 2px #ffd36b88}
.wh .pgo.no{background:#2a1c0e;color:#ff9a7a;box-shadow:inset 0 0 0 2px #b5413a}
.wh .pgo.busy{filter:brightness(.85)}
.wh .pgo svg{width:18px;height:18px}
/* adding an errand: the auction search look (sheet 22) */
.wh .askdim{position:absolute;inset:0;border-radius:30px;z-index:4;background:#0006;animation:whdi .3s var(--arrive)}
.wh .ask{position:absolute;left:0;right:0;bottom:0;top:194px;background:#0d0906;border-radius:22px;box-shadow:0 0 0 6px #b8662c,0 0 0 9px #6a3412;padding:12px;animation:whup .3s var(--arrive);z-index:5;overflow:auto;scrollbar-width:none;color:#f0e2bf}

.wh .ask.out,.wh .askdim.out{opacity:0;transition:opacity .16s var(--leave)}
.wh .aslot{height:52px;border-radius:10px;background:#120a05;box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #ffd36b88,0 0 14px #ffd36b33;display:flex;align-items:center;gap:10px;padding:0 12px}
.wh .aslot svg{width:22px;height:22px;flex:none}
.wh .aslot input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 17px Figtree,system-ui,sans-serif;color:#f0e2bf;caret-color:#ffd36b;-webkit-user-select:text;user-select:text}
.wh .asg{display:flex;align-items:center;gap:10px;background:#1a120b;border-radius:10px;padding:7px 9px;margin-top:6px;box-shadow:inset 0 0 0 2px #2a1a0e;cursor:pointer;min-height:48px}

.wh .asg.down{filter:brightness(.85)}
.wh .asg img,.wh .asg .noimg{width:32px;height:32px;border-radius:6px;box-shadow:0 0 0 2px #000}
.wh .asg .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .asg .p{font:600 13px Figtree,system-ui;color:#f0e2bf;text-align:right;flex:none}.wh .asg .p small{display:block;font:11px Figtree,system-ui;color:#8a7b63}
.wh .stepper{display:flex;align-items:center;gap:6px;flex:none}
.wh .stepper span{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:#2a1a0e;color:#f0e2bf;font:600 18px "Pixelify Sans";box-shadow:inset 0 -3px 0 #000;cursor:pointer}
.wh .stepper span:active{transform:translateY(2px)}
.wh .stepper b{min-width:26px;text-align:center;font:600 16px "Pixelify Sans";color:var(--hot)}
.wh .ahdr{font:12px "Pixelify Sans";color:#8a7b63;letter-spacing:.6px;margin:12px 2px 0}
.wh .ask .pgo{margin-top:12px}

<script>
// The phone grid, every pixel 3 CSS pixels (sheet 02 is 130 x 281 on a 390 x 844 iPhone). Wider or taller phones get
// more grid, not a blurrier scale: the Couch Mode scene (320 x 180) is cropped to the middle and sits 43 above the bottom.
const PW=Math.max(110,Math.min(320,Math.floor(innerWidth/3))), PH=Math.max(230,Math.floor(innerHeight/3));
const CROP_X=Math.round((320-PW)/2), SCENE_Y=PH-180-43;
const FX=Math.floor(PW/2), FY=SCENE_Y+152;                 // the bigger fire pit: centre of the stone ring
const px=(c,x,y,col)=>{c.fillStyle=col;c.fillRect(x,y,1,1)};
const hash=(x,y)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const noise=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=(x-xi)**2*(3-2*(x-xi)),v=(y-yi)**2*(3-2*(y-yi));
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};

// ---------- the woods, drawn once ----------
function background(){
  const off=document.createElement('canvas');off.width=320;off.height=180;const oc=off.getContext('2d');
  drawForest(oc,7,0,{noPit:true});                                          // the woods with no fire pit: real ground underneath
  const bg=document.createElement('canvas');bg.width=PW;bg.height=PH;const c=bg.getContext('2d');c.imageSmoothingEnabled=false;
  c.drawImage(off,CROP_X,0,1,1,0,0,PW,SCENE_Y+6);
  const g=c.createLinearGradient(0,0,0,SCENE_Y+6);g.addColorStop(0,'#010204');g.addColorStop(.55,'rgba(1,2,4,.85)');g.addColorStop(1,'rgba(1,2,4,0)');c.fillStyle=g;c.fillRect(0,0,PW,SCENE_Y+6);
  c.drawImage(off,CROP_X,0,PW,180,0,SCENE_Y,PW,180);
  c.fillStyle='#04060a';c.fillRect(0,SCENE_Y+180,PW,PH-SCENE_Y-180);
  const gb=c.createLinearGradient(0,SCENE_Y+170,0,SCENE_Y+186);gb.addColorStop(0,'rgba(4,6,10,0)');gb.addColorStop(1,'#04060a');c.fillStyle=gb;c.fillRect(0,SCENE_Y+170,PW,16);
  return bg;
}

// ---------- the pit: stones and logs, lit by the fire's level ----------
const STONES=[];{let s=5;const rnd=()=>(s=(s*9301+49297)%233280)/233280;const n=14;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+.1;STONES.push({a,x:FX+Math.cos(a)*30,y:FY+Math.sin(a)*11,w:9+Math.floor(rnd()*5),h:6+Math.floor(rnd()*3),m:rnd()})}}
function stones(c,lv,back){
  STONES.forEach(s=>{if((s.y<FY)!==back)return;
    const x0=Math.round(s.x-s.w/2),y0=Math.round(s.y-s.h/2),toFire=Math.atan2(FY-6-s.y,FX-s.x);
    for(let dy=0;dy<s.h;dy++)for(let dx=0;dx<s.w;dx++){
      const nx=(dx+.5)/s.w*2-1,ny=(dy+.5)/s.h*2-1,r=nx*nx+ny*ny*1.1;if(r>1)continue;
      const lit=Math.cos(Math.atan2(ny,nx)-toFire)*Math.sqrt(r)*lv,top=-ny,edge=r>.72;
      let col=lit>.45?'#b48a62':lit>.15?'#7e6650':top>.3?'#4a4a4e':ny>.45?'#1e1e22':'#35363a';
      if(edge&&lit<.3)col='#151518';
      const inner=Math.cos(Math.atan2(ny,nx)-toFire)>.55&&r>.45; if(inner&&lv<.5)col=hash(dx+x0*3,dy)>.4?'#1a1a1c':'#25252a';   // soot facing the fire
      if(!edge&&s.m>.5&&lit<-.1&&hash(dx+x0,dy)>.55)col='#2c4a2a';
      px(c,x0+dx,y0+dy,col)}})}
// the pit: an ash bed, then logs lying flat and crossed (a low pile, not a tent), charred black with a little
// bark left, ends cut. The flames rise from the middle of the pile. [x1,y1,x2,y2,thickness,layer]
function ashbed(c,lv){
  for(let y=FY-7;y<=FY+9;y++)for(let x=FX-24;x<=FX+24;x++){
    const nx=(x-FX)/24,ny=(y-FY-1)/8,r=nx*nx+ny*ny;if(r>1)continue;
    const n=hash(x,y);
    let col=r>.78?(n>.5?'#1b1715':'#232020'):n>.82?'#5a5450':n>.55?'#454140':n>.25?'#363232':'#2a2726';   // grey ash, darker rim
    if(r<.5&&n>.965)col=lv>.5?'#ff9a3a':'#c8502a';                                                          // a few live embers in the ash
    px(c,x,y,col)}}
const LOGS=[
  [FX-21,FY-2,FX+17,FY-9,5,'back'],          // one across the back
  [FX+19,FY+1,FX-15,FY-8,5,'back'],
  [FX-22,FY+6,FX+20,FY+1,6,'front'],         // two across the front, lower
  [FX+23,FY+8,FX-18,FY+4,6,'front']];
function logs(c,t,lv,which){
  const ember=.3+.7*lv, pulse=.88+.12*Math.sin(t*.6);
  LOGS.forEach(([x1,y1,x2,y2,th,layer],li)=>{if(layer!==which)return;
    const len=Math.hypot(x2-x1,y2-y1);
    for(let k=0;k<=len;k++){const tt=k/len,x=Math.round(x1+(x2-x1)*tt),y=Math.round(y1+(y2-y1)*tt);
      const mid=1-Math.abs(tt-.5)*2;                                   // 1 in the middle of the log, 0 at the ends
      for(let j=0;j<th;j++){const yy=y-j,n=hash(x,yy+li*50),bark=hash(x>>1,yy+li*31);
        // charred in the middle, bark surviving towards the ends
        const charred=mid>.35+bark*.3;
        let col;
        if(j===0)col='#0d0906';
        else if(charred)col=j===th-1?(n>.6?'#3a3330':'#2a2423'):n>.75?'#1a1512':'#231c18';
        else col=j===th-1?'#7a5230':j===th-2?'#5a3a1e':bark>.7?'#4a2c16':'#3a2210';
        const burn=charred&&j>0&&j<th-1&&n>.45;
        if(burn){const e=((n+t*.18+k*.07)%1)*ember*pulse;if(e>.78)col='#ffb24a';else if(e>.55)col='#e8602c';else if(e>.38)col='#8a2a14';else if(e>.22&&lv>.3)col='#4a1a0c'}
        px(c,x,yy,col)}}
    // cut ends with rings
    [[x1,y1],[x2,y2]].forEach(([ex,ey])=>{c.fillStyle='#8a6a44';c.fillRect(ex-1,ey-th+1,2,th);c.fillStyle='#5a3e24';c.fillRect(ex-1,ey-Math.floor(th/2),2,1)});
  })}

// ---------- flames: a heat field through noise, cut into bands. Bigger than the TV's. ----------
const BAND=[[122,36,16],[200,64,28],[240,122,44],[255,184,74],[255,233,160],[255,251,230]];
const FW=56, FH=70, FB=document.createElement('canvas');FB.width=FW;FB.height=FH;const fbc=FB.getContext('2d');const FIM=fbc.createImageData(FW,FH);
function flames(c,t,lv,touch){
  if(lv<.03)return;
  const base=FY+1, H=58*(.55+.45*lv), ox=FX-FW/2, oy=base-FH;
  FIM.data.fill(0);
  for(let yy=0;yy<FH;yy++){const y=oy+yy,h=(base-y)/H;if(h>1.15)continue;
    for(let xx=0;xx<FW;xx++){const x=ox+xx;
      const dx=(x-FX)/(19*Math.max(.1,1-h)**.65+1);
      let heat=1.02*Math.min(1,lv*1.25)-Math.abs(dx)**1.8-h*.95;
      if(h>.6)heat-=(h-.6)*2.4;
      heat+=(noise(x*.17,y*.13+t*1.5)-.5)*(.5+h*.8)+(noise(x*.38+9,y*.29+t*2.4)-.5)*.3;   // slow, lazy licks
      if(touch){const d=Math.hypot(x-touch.x,y-touch.y);heat+=touch.k*.8*Math.exp(-d*d/160)}
      if(touch&&touch.spread<1){const d=Math.hypot(x-touch.x,y-touch.y);if(d>touch.spread*70)heat-=1.5}
      if(y>base-5)heat-=(y-(base-5))*.1;
      const bnd=heat>.95?5:heat>.78?4:heat>.58?3:heat>.4?2:heat>.26?1:heat>.17?0:-1;
      if(bnd>=0&&!(bnd===0&&h>.45)){const i=(yy*FW+xx)*4,col=BAND[bnd];FIM.data[i]=col[0];FIM.data[i+1]=col[1];FIM.data[i+2]=col[2];FIM.data[i+3]=255}}}
  fbc.putImageData(FIM,0,0);c.drawImage(FB,ox,oy)}

// ---------- glow: soft pixel light, made once, brightened by the fire's strength ----------
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const GLOW=(()=>{const g=document.createElement('canvas');g.width=PW;g.height=PH;const c=g.getContext('2d');const im=c.createImageData(PW,PH);
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++){
    const d=Math.hypot((x-FX)/1.0,(y-(FY-10))*1.9);           // wide, flat pool of light on the ground
    let v=Math.max(0,1-d/95);v=v*v;                            // soft falloff
    v+= (BAYER[(y&3)*4+(x&3)]/16-.5)*.06;                      // ordered dither: pixel-art steps, no smooth smear
    v=Math.round(Math.max(0,v)*6)/6;                           // a few light levels, like hand-shaded art
    const i=(y*PW+x)*4;im.data[i]=255;im.data[i+1]=138;im.data[i+2]=58;im.data[i+3]=Math.round(v*120)}
  c.putImageData(im,0,0);return g})();
function glow(c,t,lv){if(lv<.03)return;
  const f=lv*(.9+.1*(noise(t*.7,3)));                          // slow, gentle breathing, not a flicker
  c.globalCompositeOperation='lighter';c.globalAlpha=f;c.drawImage(GLOW,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over'}

// ---------- particles: sparks, smoke, fireflies ----------
class Parts{constructor(n,spawn,step){this.p=[];this.n=n;this.spawn=spawn;this.step=step}
  run(c,dt,rate){for(let i=this.p.length-1;i>=0;i--){const q=this.p[i];this.step(q,dt);if(q.life<=0)this.p.splice(i,1);else{c.globalAlpha=q.a;px(c,Math.round(q.x),Math.round(q.y),q.col)}}
    c.globalAlpha=1;if(this.p.length<this.n&&Math.random()<rate)this.p.push(this.spawn())}}
const sparks=new Parts(10,()=>({x:FX-6+Math.random()*12,y:FY-30-Math.random()*16,vx:(Math.random()-.5)*3,vy:-9-Math.random()*6,ph:Math.random()*6.28,life:1,a:1,col:'#ffe9a0'}),
  (q,dt)=>{q.x+=q.vx*dt+Math.sin(q.ph+q.life*4)*3*dt;q.y+=q.vy*dt;q.vy*=.995;q.life-=dt*.22;q.a=Math.min(1,q.life*1.4);q.col=q.life>.6?'#ffe9a0':q.life>.3?'#ffb24a':'#e8602c'});
const smoke=new Parts(18,()=>({x:FX-3+Math.random()*6,y:FY-34,vx:(Math.random()-.5)*2,vy:-5-Math.random()*3,life:1,a:0}),
  (q,dt)=>{q.x+=q.vx*dt+Math.sin(q.y*.06+q.vx)*2*dt;q.y+=q.vy*dt;q.life-=dt*.12;q.a=Math.max(0,Math.min(.14,q.life*.3));q.col='rgb(120,130,140)'});
const flies=[];{let s=99;const rnd=()=>(s=(s*9301+49297)%233280)/233280;for(let i=0;i<16;i++)flies.push({bx:14+rnd()*102,by:SCENE_Y+70+rnd()*60,ph:rnd()*6.28,sp:.5+rnd()*.6})}
function fireflies(c,t){flies.forEach((f,i)=>{const x=Math.round(f.bx+9*Math.sin(t*.35*f.sp+f.ph)),y=Math.round(f.by+5*Math.sin(t*.5*f.sp+f.ph*2));
  const bl=(Math.sin(t*.8+i*1.9)+1)/2;if(bl<.3)return;const a=(bl-.3)/.7;
  c.fillStyle=`rgba(210,255,120,${(.12*a).toFixed(3)})`;c.fillRect(x-2,y-1,5,3);c.fillRect(x-1,y-2,3,5);c.fillStyle=`rgba(210,255,120,${(.9*a).toFixed(3)})`;c.fillRect(x,y,1,1)})}

// ---------- the "?" token: a round wooden coin ----------
function token(c,cx,cy,r){for(let y=-r;y<r;y++)for(let x=-r;x<r;x++){const d=Math.hypot(x+.5,y+.5);if(d>r)continue;
  let col;if(d>r-1)col='#120803';else if(d>r-2)col=(y+.5<-r*.25?'#c27a3e':y+.5>r*.35?'#4a2711':'#8a5230');else if(d>r-3)col='#71401f';else col=((x*3+y*7)&7)===0?'#2c180c':'#3a2212';px(c,cx+x,cy+y,col)}}
const Q=['.gggg.','gg..gg','....gg','...gg.','..gg..','..gg..','......','..gg..','..gg..'];
function question(c,x,y){Q.forEach((r,ry)=>[...r].forEach((ch,rx)=>{if(ch==='g')px(c,x+rx,y+ry+1,'#140904')}));Q.forEach((r,ry)=>[...r].forEach((ch,rx)=>{if(ch==='g')px(c,x+rx,y+ry,'#ffd36b')}))}

// ---------- the "?" coin's place; while WoW is on, the one WoW coin sits there instead (sheet 27) ----------
const QX=Math.floor(PW/2), QY=PH-22;

// ---------- the remote ----------
const app=document.getElementById('app');

function swipeOn(el){

  if('ontouchstart' in window){el.addEventListener('touchstart',e=>{const t=e.touches[0];if(e.touches.length===1)start(t.clientX,t.clientY);else s=null},{passive:true});
    el.addEventListener('touchend',e=>{const t=e.changedTouches[0];end(t.clientX,t.clientY)});el.addEventListener('touchcancel',()=>{s=null})}
  else{el.addEventListener('pointerdown',e=>start(e.clientX,e.clientY));el.addEventListener('pointerup',e=>end(e.clientX,e.clientY))}}

  if(!chatWrap){updateBadges();return}
  if(chat.view==='list'){drawList();updateBadges();return}
  if(!logEl)return;const id=chat.view;
  drawRoster();
  const stick=full||logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<40;
  if(full||!chat.lines.some(l=>l.seq===shownSeq)){logEl.textContent='';shownSeq=0}
  let added=0;for(const l of chat.lines)if(l.seq>shownSeq&&W.inChan(l,id)){if(!added++){const q=logEl.querySelector('.none');if(q)q.remove()}logEl.appendChild(lineEl(l,id))}
  if(chat.lines.length)shownSeq=Math.max(shownSeq,chat.lines[chat.lines.length-1].seq);
  while(logEl.children.length>300)logEl.firstChild.remove();
  if(!logEl.children.length)logEl.appendChild($('div','l none','Nothing yet.'));
  if(stick)logEl.scrollTop=logEl.scrollHeight;
  chat.seen[id]=chat.lines.length?chat.lines[chat.lines.length-1].seq:0;
  if(chat.whispers&&!unreadWhispers())seenWhispers();
  chat.order=W.swipeOrder(chat.order,W.busyOrder(chatRows()),id);   // a channel that got busy meanwhile joins the swipe
  drawDots();box.placeholder=W.hint(id);updateBadges()}

// the item list (auctionable items, from the laptop) and the best 3 for what's typed: the mouse pad's suggestions
let ITEMS=null,ITEM_BY=null,itemsAskedAt=0;
async function loadItems(){
  if(ITEMS&&ITEMS.length||performance.now()-itemsAskedAt<3000)return;itemsAskedAt=performance.now();
  const {ok,j}=await api('/api/items');if(!ok||!Array.isArray(j.items)||!j.items.length)return;
  ITEMS=j.items.map(([n,q,w,id])=>({n,q,w:w||0,id:id||0,l:n.toLowerCase()}));ITEM_BY=new Map(ITEMS.map(i=>[i.l,i]));if(tp.el)drawSugg()}
function near(a,b){   // a typo of the same length: at most one letter off (copr ~ copp)
  if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]&&++d>1)return false;return true}
function suggest(q){
  q=q.trim().toLowerCase();if(q.length<2||!ITEMS)return [];
  const out=[];
  for(const it of ITEMS){const l=it.l;let r;
    if(l.startsWith(q))r=0;else{const at=l.indexOf(q);
      if(at>0&&l[at-1]===' ')r=1;else if(at>0)r=2;
      else if(q.length>=3&&l.split(' ').some(w=>near(w.slice(0,q.length),q)))r=3;else continue}
    out.push({it,r})}
  out.sort((a,b)=>a.r-b.r||b.it.w-a.it.w||a.it.n.length-b.it.n.length||a.it.n.localeCompare(b.it.n));   // best match, then what really trades
  return out.slice(0,3).map(x=>x.it);
}
// a soft wood click (made here, no sound file): a short knock of filtered noise
let actx=null;
function knock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const n=actx.createBuffer(1,Math.floor(actx.sampleRate*.035),actx.sampleRate),d=n.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
  const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();src.buffer=n;f.type='bandpass';f.frequency.value=1100;f.Q.value=2.5;g.gain.value=.35;
  src.connect(f).connect(g).connect(actx.destination);src.start()}catch(e){}}

const SMILE_ON=SMILE.replace('#3a2212','#120803');
const DIE='<svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#f0e2bf" d="M1 0h7v1h1v7h-1v1h-7v-1h-1v-7h1z"/><path fill="#3a2212" d="M2 2h1v1h-1zM6 2h1v1h-1zM4 4h1v1h-1zM2 6h1v1h-1zM6 6h1v1h-1z"/></svg>';
// The one emote list (emotes.json, mockup 10, approved 2026-11-09) and this phone's favourites, both from Aang.
let CAT={pages:[],favourites:[]},LABEL={roll:'Roll'},ALL=[],FAVS=[];
async function loadEmotes(){
  try{const r=await fetch('/emotes.json',{cache:'no-store'});if(r.ok)CAT=await r.json()}catch(e){}
  ALL=[];for(const p of CAT.pages)for(const [l,c] of p.emotes){LABEL[c]=l;ALL.push(c)}
  FAVS=CAT.favourites.slice();
  try{const {ok,j}=await api('/api/favourites');if(ok&&Array.isArray(j.favourites))FAVS=j.favourites}catch(e){}
  emPage=CAT.pages.length?CAT.pages[0].name:'';
  if(trayEl){const n=tray(null);trayEl.replaceWith(n);trayEl=n;layoutEmo()}
}
function saveFavs(){api('/api/favourites',{favourites:FAVS})}
// asked of the layout itself, not innerWidth/innerHeight: iOS reports those late after turning the phone or closing the keyboard
let emoteUntil=0,swapIn=null,emPage='',emQuery='';
function emoteTile(c,name){
  const t=$('div','tile');if(c==='roll')t.innerHTML=DIE;t.append(LABEL[c]||c);
  let timer=0,long=false;
  t.addEventListener('pointerdown',()=>{long=false;clearTimeout(timer);timer=setTimeout(()=>{long=true;starMenu(c)},500)});
  const cancel=()=>clearTimeout(timer);t.addEventListener('pointerleave',cancel);t.addEventListener('pointercancel',cancel);
  t.addEventListener('contextmenu',e=>e.preventDefault());
  t.addEventListener('click',()=>{cancel();if(long)return;
    if(swapIn&&!name&&FAVS.includes(c)){finishSwap(c);return}
    const now=performance.now();if(now<emoteUntil)return;                     // the laptop sends one line a second
    emoteUntil=now+1000;t.classList.add('down');setTimeout(()=>t.classList.remove('down'),1000);
    if(c!=='roll')chat.emoteAt=now+8000;                                      // WoW's own line ("You cheer.") is shown in emote colour
    api('/api/send',c==='roll'?{act:'roll'}:name?{act:c,name}:{act:c});
    if(name)setTimeout(closeMenus,250)});
  return t;
}
// hold any emote: star it (or un-star it); when all 12 are taken, tap the favourite to swap out
function starMenu(c){
  const has=FAVS.includes(c);const m=menuShell(LABEL[c]||c);
  mi(m,has?'Remove from favourites':'Add to favourites',null,()=>{
    if(has){FAVS=FAVS.filter(x=>x!==c);saveFavs();refreshTray();return}
    if(FAVS.length<12){FAVS.push(c);saveFavs();refreshTray();return}
    swapIn=c;chat.emo='tray';refreshTray();layoutEmo()});
  mi(m,'Cancel',null,()=>{});
}
function finishSwap(out){const i=FAVS.indexOf(out);if(i>=0)FAVS[i]=swapIn;swapIn=null;saveFavs();refreshTray()}
function refreshTray(){if(!trayEl)return;const n=tray(null);trayEl.replaceWith(n);trayEl=n;layoutEmo();if(chat.emo==='more')showMore(moreFor)}
function tray(name){
  const g=$('div','tray'+(swapIn&&!name?' swapping':''));
  // at a person: your favourites (no Roll) and Follow
  const list=name?[...FAVS.filter(c=>c!=='roll'),...(FAVS.includes('follow')?[]:['follow'])].slice(0,12):FAVS;
  for(const c of list){const t=emoteTile(c,name);if(swapIn&&!name)t.classList.add('pick');g.appendChild(t)}
  if(swapIn&&!name){const h=$('div','swaphint','Tap the favourite to swap for '+(LABEL[swapIn]||swapIn));g.appendChild(h)}
  else{const more=$('div','tile more','More');more.addEventListener('click',()=>{closeMenus();if(moreEl)showMore(name)});g.appendChild(more)}
  return g;
}
let moreFor=null;
function showMore(name){
  moreFor=name;moreEl.textContent='';
  if(name)moreEl.appendChild($('div','head','At '+short(name)));
  const sb=$('input','esearch');sb.type='search';sb.placeholder='Search emotes';sb.value=emQuery;sb.autocomplete='off';sb.enterKeyHint='done';
  sb.addEventListener('input',()=>{emQuery=sb.value;draw()});sb.addEventListener('keydown',e=>{if(e.key==='Enter')sb.blur()});
  const chips=$('div','chips');
  for(const p of CAT.pages){const c=$('div','chip',p.name);c.addEventListener('click',()=>{emPage=p.name;emQuery='';sb.value='';draw();c.scrollIntoView({inline:'center',block:'nearest'})});chips.appendChild(c)}
  const grid=$('div','grid'),note=$('div','enote');
  // Reload WoW moved to the home header's hold key (sheet 29, Joshua 2026-11-27)
  moreEl.append(sb,chips,grid,note);
  function draw(){
    const q=emQuery.trim().toLowerCase();
    const list=q?ALL.filter(c=>(LABEL[c]||c).toLowerCase().includes(q)).slice(0,12):((CAT.pages.find(p=>p.name===emPage)||{emotes:[]}).emotes.map(e=>e[1]));
    grid.textContent='';for(const c of list){const t=emoteTile(c,name);if(!name&&FAVS.includes(c))t.classList.add('fav');grid.appendChild(t)}
    for(let i=list.length;i<12;i++)grid.appendChild($('div','tile blank'));          // always three rows: nothing jumps
    chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!q&&c.textContent===emPage));
    note.textContent=q&&!list.length?'Nothing called that.':'Hold any emote to add it to your favourites.';
  }
  draw();
  if(document.activeElement===box)box.blur();
  chat.emo='more';layoutEmo();
  requestAnimationFrame(()=>{const on=chips.querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})});
}
function smiley(){
  swapIn=null;
  if(document.activeElement===box){box.blur();chat.emo='tray'}               // typing: the tray takes the keyboard's place
  else chat.emo=chat.emo?null:'tray';
  layoutEmo();
}
function layoutEmo(){
  if(!sendEl||!chatWrap)return;
  emoEl.classList.toggle('on',!!chat.emo);emoEl.innerHTML=chat.emo?SMILE_ON:SMILE;
  trayEl.hidden=chat.emo!=='tray';moreEl.hidden=chat.emo!=='more';
  const stick=logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<40;
  // move the tray and More sheet only when they're not already in place: moving a node takes the cursor out of the
  // emote search box, so the keyboard opened and at once closed again (Joshua 2026-11-11: "cant click into the search bar")
  if(moreEl.parentNode!==chatWrap||moreEl.nextSibling!==trayEl||trayEl.nextSibling!==sendEl){chatWrap.insertBefore(moreEl,sendEl);chatWrap.insertBefore(trayEl,sendEl)}
  if(stick){logEl.scrollTop=logEl.scrollHeight;logStuck=true}
}
function relayout(){layoutEmo();fitPanel()}
function settle(){relayout();requestAnimationFrame(relayout);setTimeout(relayout,300)}  // and again once iOS has finished turning
addEventListener('resize',settle);addEventListener('orientationchange',settle);

// ---------- tap a link: a WoW tooltip, looked up by Aang ----------
function tooltip(s){
  closeMenus();const dm=$('div','mdim');app.appendChild(dm);
  const t=$('div','tip');const nm=$('div','nm',s.name);t.appendChild(nm);const body=$('div');t.appendChild(body);
  t.appendChild($('div','fine','tap anywhere to close'));app.appendChild(t);
  const close=()=>closeMenus();dm.addEventListener('click',close);t.addEventListener('click',close);
  const q=s.id?`kind=${s.link}&id=${s.id}`:`name=${encodeURIComponent(s.name)}${s.link!=='unknown'?'&kind='+s.link:''}`;
  api('/api/lookup?'+q).then(({ok,j})=>{
    if(!t.isConnected)return;
    if(!ok||!j.lines){body.appendChild($('div','gy','Not found on Wowhead'));return}
    const qc=j.kind==='quest'?'quest':j.kind==='spell'?'spell':j.q!=null?'q'+j.q:'item';
    nm.className='nm '+qc;nm.textContent=j.name;
    if(!s.id&&!s.q){chat.linkColor[s.name]=qc;logEl&&logEl.querySelectorAll('.lk').forEach(a=>{if(a.dataset.name===s.name&&a.dataset.coded!=='1')a.className='lk '+qc})}
    j.lines.forEach((x,i)=>{if(i===0&&x.l===j.name&&!x.r)return;
      const row=$('div',(x.r?'two ':'')+(x.c||''));row.appendChild($('span',null,x.l));if(x.r)row.appendChild($('span',null,x.r));body.appendChild(row)})});
}

// ---------- say it, send it (Joshua 2026-11-09: no confirm card for typed lines) ----------
// Enter or the Send button sends straight away and the keyboard stays up. The line shows in the log at once, faded,
// until WoW's own copy arrives; if Couch Mode refuses it the text goes back in the box with a short note.
// Couch Mode's allow-list on the laptop still decides what may be typed into WoW.
let sending=false;
function send(){
  const text=box.value.trim();if(!text||sending)return;
  sending=true;box.value='';hint(null);
  const ask=chat.to.to==='whisper'?{to:'whisper',name:chat.to.name,text}:chat.to.to==='channel'?{to:'channel',num:chat.to.num,text}:{to:chat.to.to,text};
  const pend=$('div','l pend');pend.textContent=text;logEl.appendChild(pend);logEl.scrollTop=logEl.scrollHeight;
  api('/api/send',ask).then(({ok,j})=>{sending=false;
    if(ok){setTimeout(()=>pend.remove(),2500);return}                 // WoW's copy comes in with the next poll
    pend.remove();if(!box.value)box.value=text;
    hint(j&&j.why==='refused'?'WoW won\'t take that line':j&&j.why==='not-in-wow'?'WoW is not up':'Not sent, try again')});
}
function hint(msg){
  let h=sendEl&&sendEl.querySelector('.hint');
  if(!msg){if(h)h.remove();return}
  if(!h){h=$('div','hint');sendEl.appendChild(h)}
  h.textContent=msg;clearTimeout(h._t);h._t=setTimeout(()=>h.remove(),4000);
}

  const key=x=>x[1]==='none'?x[0]:(x[1]==='LTRT'?'LT + RT':x[1])+' + '+(['U','D','L','R'].includes(x[2])?'D-'+{U:'up',D:'down',L:'left',R:'right'}[x[2]]:x[2]);
  const row=(x,i,pre)=>`<div class="step${!pre&&i===sel?' on':''}${NEW.has(x[4])?' glow':''}" data-i="${pre?'':i}"><span class="n">${pre?'•':i+1}</span><img src="${BI(x[3])}" alt=""><div><div class="t">${esc(x[4])}${NEW.has(x[4])?'<span class="nb">NEW</span>':''}</div><div class="d">${esc(x[5])}</div></div><span class="key">${key(x)}</span></div>`;
  const draw=()=>{const s=S[sel]||S[0];const lay=s?s[1]:'',btn=s?s[2]:'';const d=['U','D','L','R'].includes(btn);
   w.innerHTML=`<div class="k">Your rotation <b>level ${B.level}</b></div>
   ${s?`<div class="mini"><div class="trig"><span class="${lay==='LT'||lay==='LTRT'?'on':''}">LT</span><span class="${lay==='RT'||lay==='LTRT'?'on':''}">RT</span></div>
   <div class="dpad">${['U','D','L','R'].map(k=>`<span class="${k} ${(d&&btn===k)?'on':''}">${{U:'▲',D:'▼',L:'◀',R:'▶'}[k]}</span>`).join('')}</div>
   <div class="face">${['Y','X','B','A'].map(k=>`<span class="${k} ${(!d&&btn===k)?'on':''}">${k}</span>`).join('')}</div></div>`:''}
   ${S.map((x,i)=>row(x,i)).join('')}
   ${P.length?`<div class="k" style="margin-top:10px">Before a fight</div>${P.map(x=>row(x,0,true)).join('')}`:''}
   <p class="note">Top of the list first, whatever's ready. It changes as you learn new spells: new ones glow until your next reload.${B.crusader?' Seal of the Crusader: skip it solo, Righteousness hits harder.':''}</p>`;
   w.querySelectorAll('.step[data-i]').forEach(e=>{if(e.dataset.i!=='')e.onclick=()=>{sel=book.ui.sel=+e.dataset.i;draw()}})};

// The talents tab (sheet 25 v2, Joshua 2026-11-27: "one level at a time or multiple levels"): − and + step through the
// road (tap one level, hold to run), a strip of every level to jump to, the tree as it will be at that level. The road
// comes from Aang's book (his real ranks; off-path points move it, never break it). The 59-60 pick is kept on this phone.
const FORK_KEY='omashu.talentFork',STARS={'Seal of Command':1,'Repentance':1,'Unsealed Wrath':1,'Precision':1};
const tHold={t:0,d:0,end:null};addEventListener('pointerup',()=>tHold.end&&tHold.end());addEventListener('pointercancel',()=>tHold.end&&tHold.end());
function bookTalents(w,B){
  const T=Object.fromEntries(B.tree.map(x=>[x.name,x])),pad=B.pad||{},desc=B.desc||{},have=n=>B.ranks[n]||0;
  const fork=(()=>{try{return localStorage.getItem(FORK_KEY)==='Holy Conduit'?'Holy Conduit':"Guardian's Favor"}catch(e){return "Guardian's Favor"}})();
  const P=(B.road||[]).filter(p=>T[p.name]).map(p=>p.name==="Guardian's Favor"&&fork!=="Guardian's Favor"?{...p,name:fork}:p);
  const plan={};B.path.forEach(([n,,r])=>plan[n]=(plan[n]||0)+r);
  const first=P.length?P[0].lvl:B.level,last=P.length?P[P.length-1].lvl:B.level;
  const at=lv=>P.find(p=>p.lvl===lv);
  const rankAt=(n,lv)=>Math.max(have(n),P.filter(p=>p.name===n&&p.lvl<=lv).reduce((m,p)=>Math.max(m,p.rank),0));
  let tree=book.ui.tree||'Retribution',pick=null;book.ui.at=Math.min(last,Math.max(first,book.ui.at||first));
  const step=d=>{const v=Math.min(last,Math.max(first,book.ui.at+d));if(v===book.ui.at)return;book.ui.at=v;const p=at(v);if(p)tree=book.ui.tree=T[p.name].tree;pick=null;draw()};
  tHold.end=()=>{if(!tHold.d)return;clearTimeout(tHold.t);tHold.d=0;if(w.isConnected)draw()};
  const draw=()=>{const lv=book.ui.at,p=at(lv),totals=t=>B.tree.filter(n=>n.tree===t).reduce((a,n)=>a+(p?rankAt(n.name,lv):have(n.name)),0);
    let top=(B.off||[]).map(o=>`<div class="bend">${T[o.name]?`<img src="${BI(T[o.name].icon)}" alt="">`:''}<div><div class="t">You took ${esc(o.name)}</div><div class="d">${esc(o.note)}</div></div></div>`).join('');
    if(p){const x=T[p.name],now=lv<=B.level,ahead=lv-B.level,pd=pad[x.name];
      top+=`<div class="lvbar"><div class="sk${lv<=first?' off':''}${tHold.d<0?' down':''}" data-d="-1">−</div><div class="lvn"><b>Level ${lv}</b><span>${now?'now · spend it':ahead===1?'next level':ahead+' levels ahead'}</span></div><div class="sk${lv>=last?' off':''}${tHold.d>0?' down':''}" data-d="1">+</div></div>
      <div class="tnext${now?' now':''}"><div class="ic${STARS[x.name]?' star':''}"><img src="${BI(x.icon)}" alt=""></div><div style="flex:1;min-width:0">
      <div class="lv">${x.tree==='Retribution'?'Ret':x.tree==='Protection'?'Prot':'Holy'} · rank ${p.rank} of ${x.max}</div>
      <div class="t">${esc(x.name)}<span class="pips">${Array.from({length:x.max},(_,i)=>`<i class="${i<have(x.name)?'f':i<p.rank?'p':''}"></i>`).join('')}</span></div></div></div>
      <div class="twhy">${esc(desc[x.name]||'')}</div>${pd?`<div class="tpadl"><span class="pb">${esc(pd.split(': ')[1]||'')}</span>${esc(pd.split(': ')[0])}</div>`:''}
      ${x.name==="Guardian's Favor"||x.name==='Holy Conduit'?`<div class="fork">${["Guardian's Favor",'Holy Conduit'].filter(n=>T[n]).map(n=>`<div class="fk${n===fork?' on':''}" data-f="${esc(n)}"><img src="${BI(T[n].icon)}" alt=""><div class="t">${esc(n)}</div><div class="d">${n==='Holy Conduit'?'Questing in packs':'World PvP'}</div></div>`).join('')}</div>`:''}
      <div class="lvs">${P.map(q=>`<div class="lt${q.lvl===lv?' sel':''}${q.lvl<lv?' got':''}${STARS[q.name]?' star':''}" data-l="${q.lvl}"><img src="${BI(T[q.name].icon)}" alt=""><span>${q.lvl}</span></div>`).join('')}</div>`}
    else top+=`<div class="set"><img src="${BI('classicon_paladin')}" alt=""><div class="t">Every point is spent.</div><div class="d">Nothing left on the road.</div></div>`;
    const nodes=B.tree.filter(x=>x.tree===tree);let cells='';
    for(let tier=1;tier<=7;tier++)for(let c=0;c<4;c++){const n=nodes.find(q=>q.tier===tier&&q.col===c);if(!n){cells+='<div></div>';continue}
      const h=have(n.name),r=p?rankAt(n.name,lv):h,cls=p&&n.name===p.name?(lv<=B.level?'next':'look'):r>h?'ghost':h>=n.max?'max':h>0?'part':plan[n.name]?'later':'';
      cells+=`<div class="nd ${cls}${n.name===pick?' sel':''}" data-n="${esc(n.name)}"><img src="${BI(n.icon)}" alt="${esc(n.name)}"><b>${r}/${n.max}</b></div>`}
    const x=pick&&T[pick];
    w.innerHTML=`${top}<div class="trees" style="margin-top:10px">${['Holy','Protection','Retribution'].map(t=>`<span class="${t===tree?'on':''}" data-t="${t}">${t==='Protection'?'Prot':t==='Retribution'?'Ret':t}<i>${totals(t)}</i></span>`).join('')}</div>
      <div class="tree">${cells}</div>${x?`<div class="tt"><h5>${esc(x.name)}<span class="pips">${Array.from({length:x.max},(_,i)=>`<i class="${i<have(x.name)?'f':''}"></i>`).join('')}</span></h5><span class="rk">${have(x.name)}/${x.max} now · not on your road</span><div style="margin-top:4px">${esc(desc[x.name]||'')}</div></div>`:''}`;
    // − and +: tap for one level, hold to run (the page redraws on each step, so the hold lives outside the buttons)
    w.querySelectorAll('.sk').forEach(k=>{const d=+k.dataset.d;k.onpointerdown=e=>{e.preventDefault();knock();clearTimeout(tHold.t);tHold.d=d;step(d);let gap=380;const go=()=>{tHold.t=setTimeout(()=>{step(d);gap=Math.max(90,gap*0.75);go()},gap)};go();draw()}});
    w.querySelectorAll('.lt').forEach(e=>e.onclick=()=>{book.ui.at=+e.dataset.l;tree=book.ui.tree=T[at(book.ui.at).name].tree;pick=null;draw()});
    w.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{tree=book.ui.tree=e.dataset.t;draw()});
    w.querySelectorAll('.nd').forEach(e=>e.onclick=()=>{const q=P.find(q=>q.name===e.dataset.n);if(q){book.ui.at=q.lvl;pick=null}else pick=pick===e.dataset.n?null:e.dataset.n;draw()});
    w.querySelectorAll('.fk').forEach(e=>e.onclick=()=>{knock();try{localStorage.setItem(FORK_KEY,e.dataset.f)}catch(_){}bookTalents(w,B)});
    const sel=w.querySelector('.lt.sel'),rd=w.querySelector('.lvs');if(sel&&rd)rd.scrollLeft=Math.max(0,sel.offsetLeft-rd.offsetLeft-rd.clientWidth/2+24)};
  if(P.length&&at(book.ui.at))tree=book.ui.tree=T[at(book.ui.at).name].tree;
  draw()}

// ---------- the WoW home (sheet omashu/remote/27, approved 2026-11-27): one coin, one home, Now · Chat · Pad · Book ----------
// The coin (class icon and level; pink = unread whispers, gold dot = danger in his zone or training waiting) takes the
// place of the "?" while WoW is on. The home opens on Chat when a whisper is waiting, else on the page used last.
const HOME_KEY='omashu.homePage';
const SV={
 now:'<svg viewBox="0 0 12 12"><path d="M5 1h2v1h1v1h1v2h1v2h-1v2h-1v1h-1v1h-2v-1h-1v-1h-1v-2h-1v-2h1v-2h1v-1h1z" fill="currentColor"/><rect x="5.5" y="3" width="1" height="4" fill="#0d0906"/><rect x="5.5" y="8" width="1" height="1" fill="#0d0906"/></svg>',

 book:'<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M1 2h4l1 1 1-1h4v8h-4l-1 1-1-1h-4z" fill="currentColor"/><rect x="5.5" y="3" width="1" height="7" fill="#0d0906"/></svg>'};

const PLUS='<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M5 2h2v3h3v2h-3v3h-2v-3h-3v-2h3z" fill="#9a8f78"/></svg>';
const LENS='<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M3 1h4v1h1v1h1v4h-1v1h-1v1h-4v-1h-1v-1h-1v-4h1v-1h1zM3 3v3h1v1h3v-1h1v-3h-1v-1h-3v1z" fill="#c8962e"/><path d="M8 8h1v1h1v1h1v1h-1v-1h-1v-1h-1z" fill="#c8962e"/></svg>';

const home={el:null,well:null,page:null,ask:null,sent:{},nowSig:''};
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const homePages=()=>book.on?['now','chat','pad','book']:['now','chat','pad'];
function openHome(){
  if(home.el||!chat.on)return;closeSheet();
  const dim=$('div','whdim');dim.addEventListener('click',closeHome);app.appendChild(dim);
  const el=$('div','wh');el.innerHTML='<div class="grip"></div><div class="head"></div><div class="well"></div><div class="hbar"></div>';
  app.appendChild(el);home.el=panel=el;home.well=el.querySelector('.well');
  el.querySelector('.grip').addEventListener('click',closeHome);
  dropTicked();drawHead();
  let start=unreadWhispers()>0?'chat':(()=>{try{return localStorage.getItem(HOME_KEY)}catch(e){return null}})()||'now';
  if(!homePages().includes(start))start='now';
  showPage(start,true);
  if(book.on)loadBook();
}
function closeHome(){
  if(!home.el)return;leavePage();closeAsk(true);
  const el=home.el,dim=app.querySelector('.whdim');home.el=home.well=home.page=null;panel=null;
  el.classList.add('out');if(dim)dim.classList.add('out');setTimeout(()=>{el.remove();if(dim)dim.remove()},reduced()?0:160);
}
function leavePage(){if(home.page==='pad')closePad();else if(home.page==='chat')unmountChat()}
function showPage(p,first){
  if(!home.el||p===home.page&&!first)return;
  leavePage();closeAsk(true);
  home.page=p;try{localStorage.setItem(HOME_KEY,p)}catch(e){}
  const w=home.well;w.className='well';w.textContent='';w.scrollTop=0;void w.offsetWidth;w.className='well pagefade'+(p==='chat'||p==='pad'?' flush':'');
  drawBar();
  if(p==='now'){home.nowSig='';drawNow()}
  else if(p==='chat')mountChat(w);
  else if(p==='pad')openPad(w);
  else drawBookPage();

// sheet 29: hold the brass key 500 ms to reload WoW (the 12x12 pixel arrow drawn 2x)
const RL_ARROW=["...####.....",".######.....",".##......##.","##......####","##.......##.","##.......##.","##.......##.","##.......##.",".##.....##..","..#######...","...#####....","............"];
const reloadKey={node:null,holding:false,busy:false,p:0,raf:0,t0:0,
  el(){if(this.node)return this.node;
    let r='';RL_ARROW.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='#')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}));
    const k=$('div','rl');k.innerHTML=`<div class="face"><svg viewBox="0 0 12 12" fill="#3a1e06">${r}</svg></div>`;
    k.setAttribute('role','button');k.setAttribute('aria-label','Hold to reload WoW');
    const set=v=>{this.p=v;k.style.setProperty('--p',v)};
    const tick=()=>{set(Math.min(1,(performance.now()-this.t0)/500));if(this.p>=1)return fire();this.raf=requestAnimationFrame(tick)};
    const fire=()=>{this.holding=false;this.busy=true;k.classList.remove('down');k.classList.add('fired','wait');k.querySelector('svg').style.fill='#6a3a08';
      try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}knock();api('/api/send',{act:'reload'}).catch(()=>{});
      // WoW takes a few seconds; the key glows steady, then it's ready again
      setTimeout(()=>{k.classList.remove('fired','wait');k.querySelector('svg').style.fill='';set(0);this.busy=false},6000)};
    const drain=()=>{cancelAnimationFrame(this.raf);this.holding=false;k.classList.remove('down');const s0=this.p,t=performance.now();
      const d=()=>{const q=Math.max(0,s0*(1-(performance.now()-t)/160));set(q);if(q>0)this.raf=requestAnimationFrame(d)};d()};
    k.addEventListener('pointerdown',e=>{if(this.busy)return;e.preventDefault();e.stopPropagation();try{k.setPointerCapture(e.pointerId)}catch(_){}
      cancelAnimationFrame(this.raf);this.holding=true;k.classList.add('down');this.t0=performance.now()-this.p*500;this.raf=requestAnimationFrame(tick)});
    for(const n of['pointerup','pointercancel','lostpointercapture'])k.addEventListener(n,()=>{if(this.holding&&this.p<1)drain()});
    k.addEventListener('contextmenu',e=>e.preventDefault());
    return this.node=k}};
function drawHead(){
  if(!home.el)return;const h=home.el.querySelector('.head'),B=book.data,zone=chat.zone||(B&&B.zone)||'';
  const html=B?`<img src="${BI('classicon_paladin')}" alt=""><div class="hw"><div class="nm">${esc(B.name)} <small>Paladin</small></div><div class="sub">Level ${B.level}${B.spec?' '+esc(B.spec):''}${zone?' · '+esc(zone):''}</div><div class="xp"><i style="width:${Math.max(0,Math.min(100,B.xpPct||0))}%"></i></div></div>`
    :`<div class="hw"><div class="nm">World of Warcraft</div><div class="sub">${book.level?'Level '+book.level+(zone?' · ':''):''}${esc(zone)}</div></div>`;
  if(html===h.dataset.html&&h.querySelector(".rl"))return;if(reloadKey.holding&&h.contains(reloadKey.node))return;
  h.dataset.html=html;h.innerHTML=html;h.appendChild(reloadKey.el())}
function drawBar(){
  if(!home.el)return;const bar=home.el.querySelector('.hbar'),pages=homePages();
  if(bar.dataset.p!==pages.join()){bar.dataset.p=pages.join();
    bar.innerHTML=pages.map(p=>`<div class="bk" data-p="${p}">${SV[p]}${p[0].toUpperCase()+p.slice(1)}${p==='chat'?'<span class="n" hidden></span>':p==='now'?'<span class="dot" hidden></span>':''}</div>`).join('');
    bar.querySelectorAll('.bk').forEach(b=>b.addEventListener('click',()=>{knock();showPage(b.dataset.p)}))}
  bar.querySelectorAll('.bk').forEach(b=>b.classList.toggle('on',b.dataset.p===home.page));
  updateBadges()}
// the coin and the bar keys: unread whispers (pink number), danger or training waiting (gold dot)
function updateBadges(){
  const n=chat.on?unreadWhispers():0,dot=chat.on&&(chat.danger.length>0||book.on&&book.train>0),txt=n>99?'99+':String(n);
  const num=e=>{if(e){e.hidden=!n;e.textContent=txt}},spot=e=>{if(e)e.hidden=!dot};
  num(wowCoin.querySelector('.n'));spot(wowCoin.querySelector('.dot'));
  if(home.el){num(home.el.querySelector('.bk[data-p="chat"] .n'));spot(home.el.querySelector('.bk[data-p="now"] .dot'))}}
function setCoin(){
  wowCoin.classList.toggle('on',chat.on);
  const ic=wowCoin.querySelector('.ic'),k=book.on?'pal':'wow';
  if(ic.dataset.k!==k){ic.dataset.k=k;ic.innerHTML=book.on?`<img src="${BI('classicon_paladin')}" alt="">`:BUBBLE}
  const lv=wowCoin.querySelector('.lv');lv.hidden=!book.on||!book.level;lv.textContent=book.level||'';
  updateBadges()}

// ---------- Now: danger (only when any), errands for the next town trip, then what's worth a detour ----------
const agoHtml=at=>{const m=Math.max(0,Math.round((Date.now()-at)/60000));return m<1?'just<br>now':m<60?`${m} min<br>ago`:`${Math.round(m/60)} h<br>ago`};
const ERR_KEY=()=>'omashu.errands.'+(myName()||'wow');
function errands(){try{const a=JSON.parse(localStorage.getItem(ERR_KEY())||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.n==='string'&&x.n).slice(0,30):[]}catch(e){return []}}
function saveErrands(a){try{localStorage.setItem(ERR_KEY(),JSON.stringify(a.slice(0,30)))}catch(e){}}
// ticked errands are done: they leave the list the next time the home opens
function dropTicked(){const a=errands();if(a.some(x=>x.done))saveErrands(a.filter(x=>!x.done))}
function qty(m){const B=book.data,have=B&&B.bags?B.bags[m.id]||0:null;return have==null||!m.id?'×'+m.c:`${have}/${m.c}`}
function detourWhere(d,B){
  const parts=[d.here?`${d.giver} · in your zone now`:`${d.zone}, ${d.giver}`,d.note.replace(/\.$/,'')];
  if(B&&B.level<d.min)parts.push('from '+d.min);
  return parts.join(' · ')}
// what the Now page shows, so a poll redraws it only when something on it changed (a redraw under a finger loses taps)

// Speed: a laptop-trackpad curve. Slow finger = fine control, fast flick = across the TV. Moves are gathered and
// sent one message at a time (never a queue), so the pointer is never behind your finger by more than one trip.
// libinput's touchpad curve in phone points (reports/Phone trackpad research 2026-11-26.md): slow = finer, a flick up
// to 5.3x; base 2 px per pt. Tap: lifted within 180 ms, moved under 8 pt. Two-finger tap: both up within 200 ms.
