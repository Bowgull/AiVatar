<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 6.17: the snip shrunk to a corner card, like an iPhone screenshot. It never sends by itself. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;
               font-src 'self'; style-src-attr 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>Snipit</title>
<link rel="stylesheet" href="cockpit.css">
<link rel="stylesheet" href="snipcard.css">
</head>
<body>
<div class="card">
  <div class="top"><span class="plaque">SNIPIT</span><i class="pointer" aria-hidden="true"></i></div>
  <div class="frame"><img id="snip" alt="Your snip"></div>
  <div class="keys">
    <button id="send" class="key primary sm" type="button">Send<span class="k">A</span></button>
    <button id="bin" class="key sm" type="button">Bin it<span class="k">Z</span></button>
  </div>
</div>
<script src="snipcard.js" type="module"></script>
</body>
</html>
