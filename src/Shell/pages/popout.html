<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Served from 127.0.0.1, not from a file: a YouTube embed from file:// fails with Error 153.
     frame-src is the one thing this page is allowed to reach out for, because the video lives there. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;
               frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https:;
               style-src-attr 'unsafe-inline';
               form-action 'none'; base-uri 'none'">
<title>Aang</title>
<link rel="stylesheet" href="popout.css">
</head>
<body>
  <div class="frame" id="frame">
    <div class="bar">
      <i class="grip"></i>
      <span class="what" id="what">Nothing playing</span>
      <span class="src" id="src" hidden></span>
      <span class="keys">
        <button class="key" id="hide" title="Hide it (the video keeps playing)" aria-label="Hide it"><svg viewBox="0 0 7 7" width="10" height="10" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 5h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1z" fill="#e8e0f5"/></svg></button>
        <button class="key close" id="close" title="Close" aria-label="Close"><svg viewBox="0 0 7 7" width="10" height="10" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h1v1h-1zM6 0h1v1h-1zM1 1h1v1h-1zM5 1h1v1h-1zM2 2h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1zM4 4h1v1h-1zM1 5h1v1h-1zM5 5h1v1h-1zM0 6h1v1h-1zM6 6h1v1h-1z" fill="#e8e0f5"/></svg></button>
      </span>
    </div>
    <div class="stage">
      <div class="empty" id="empty">Ask Aang to put something on.</div>
      <iframe id="video" hidden allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
              referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <div class="skip" id="skip">
        <span class="said" id="skipsaid"></span>
        <button class="undo" id="skipundo">Undo</button>
      </div>
    </div>
    <!-- 2026-10-13, his ask: the site's own player controls show in the picture, so Aang's play, scrub, time, mute and
         volume are gone (kept hidden here only so the page's scripts still find them). -->
    <div class="ctrl" id="ctrl" hidden>
      <button class="ico gold" id="play" title="Play and pause">
        <svg viewBox="0 0 16 16" id="playicon" shape-rendering="crispEdges"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
      </button>
      <div class="track" id="scrub" title="Where you are in the video">
        <i class="fill" id="scrubfill"></i><i class="knob" id="scrubknob"></i>
      </div>
      <span class="tnum" id="time">0:00 / 0:00</span>
    </div>
    <div class="ctrl" id="ctrl2" style="border-top:none;padding-top:0">
      <button class="ico sm" id="mute" title="Mute" hidden>
<svg viewBox="0 0 7 7" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM5 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM6 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM6 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM5 5h1v1h-1zM3 6h1v1h-1z" fill="#e8e0f5"/></svg>
      </button>
      <div class="track short" id="vol" title="Volume" hidden>
        <i class="fill" id="volfill"></i><i class="knob" id="volknob"></i>
      </div>
      <span class="seeicon" id="seethroughicon" title="See-through" aria-hidden="true"><svg viewBox="0 0 7 7" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h1v1h-1zM3 0h1v1h-1zM4 0h1v1h-1zM1 1h1v1h-1zM2 1h1v1h-1zM5 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM6 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM6 4h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM5 5h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1z" fill="#FFE096"/></svg></span>
      <div class="track short" id="see" title="See-through: slide down and the game shows through">
        <i class="fill" id="seefill"></i><i class="knob" id="seeknob"></i>
      </div>
      <span class="tnum" id="seenum">100%</span>
      <span style="flex:1"></span>
      <button class="ico sm" id="pin" title="Pin: clicks go through to your game. Ctrl+Alt+P pins and unpins.">
<svg viewBox="0 0 7 7" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 0h3v1H2zM2 1h1v2H2zM4 1h1v2H4zM1 3h5v1H1zM3 4h1v3H3z" fill="#e8e0f5"/></svg>
      </button>
      <button class="ico sm" id="mac" title="Send this to the MacBook. It stops playing here.">
<svg viewBox="0 0 7 7" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h1v1h-1zM1 0h1v1h-1zM2 0h1v1h-1zM3 0h1v1h-1zM4 0h1v1h-1zM5 0h1v1h-1zM6 0h1v1h-1zM0 1h1v1h-1zM6 1h1v1h-1zM0 2h1v1h-1zM6 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM0 5h1v1h-1zM1 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1z" fill="#e8e0f5"/></svg>
      </button>
      <button class="ico sm" id="full" title="Fullscreen">
<svg viewBox="0 0 7 7" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h1v1h-1zM1 0h1v1h-1zM5 0h1v1h-1zM6 0h1v1h-1zM0 1h1v1h-1zM6 1h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM0 6h1v1h-1zM1 6h1v1h-1zM5 6h1v1h-1zM6 6h1v1h-1z" fill="#e8e0f5"/></svg>
      </button>
    </div>
  </div>
<script type="module" src="popout.js"></script>
</body>
</html>
