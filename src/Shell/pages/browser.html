<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 6.20: the browser's frame, sheet 3. The pages themselves are separate views placed in the page area;
     this frame only ever shows the band, the rail and its own plates. Favicons are the only outside
     images (img-src https:), drawn by <img>, nothing else from the internet. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: https:;
               font-src 'self'; style-src-attr 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>Aang Browser</title>
<link rel="stylesheet" href="cockpit.css">
<link rel="stylesheet" href="browser.css">
</head>
<body>
<div class="bw">
  <div class="band" id="band">
    <i class="cap"></i>
    <button class="rnd" id="back" type="button" aria-label="Back">&#8249;</button>
    <button class="rnd" id="fwd" type="button" aria-label="Forward">&#8250;</button>
    <button class="rnd" id="reload" type="button" aria-label="Reload">&#10227;</button>
    <button class="rnd" id="theatre" type="button" aria-label="Theatre: hide the frame for watching" title="Theatre: hide the frame for watching"><i class="scr"></i></button>
    <div class="slot" id="slot">
      <span class="lock" id="lock">SECURE</span>
      <span class="url" id="url"></span>
      <input class="edit" id="edit" type="text" spellcheck="false" autocomplete="off" aria-label="Search or type a web address" hidden>
      <!-- Shown only while Aang is the one driving (6.23 onwards); you driving is the normal case, so it says nothing. -->
      <span class="who" id="who" hidden>AANG IS DRIVING</span>
    </div>
    <i class="cap"></i>
    <!-- 6.22: a website's ask hangs from the band, joined to it, so it is plainly the browser's and not the page's. -->
    <div class="bandchip" id="askchip" hidden>
      <div class="q" id="askq"></div>
      <p class="m" id="askm"></p>
      <div class="keys">
        <button class="key primary sm" id="askyes" type="button">Allow for this call<span class="k">A</span></button>
        <button class="key sm" id="askno" type="button">No<span class="k">Z</span></button>
      </div>
    </div>
    <!-- The SECURE plaque's own little panel: the one place ads can be let through, one site at a time. -->
    <div class="bandchip site" id="sitepanel" hidden>
      <div class="q" id="sitehost"></div>
      <label class="adrow"><button class="sw" id="adsw" type="button" role="switch" aria-checked="true"><i class="bed"><i class="nub"></i></i></button>
        <span><b>Block ads on this site</b><small id="adnote"></small></span></label>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <!-- Theatre: the band and rail fold away and only this thin strip stays, to drag the window and to come back. -->
  <div class="strip" id="strip" hidden>
    <button class="key sm" id="untheatre" type="button">Show the frame</button>
  </div>
  <div class="loading" id="loading"><i></i></div>
  <div class="body3">
    <nav class="rail" id="rail" aria-label="Tabs">
      <button class="key sm newtab" id="newtab" type="button">+ New tab<span class="k">Ctrl T</span></button>
      <div id="tabs"></div>
    </nav>
    <div class="pg3" id="page">
      <div class="plate" id="phishplate" hidden>
        <span class="plq red">STOPPED &middot; FAKE SITE</span>
        <h3 id="phishtitle">This site is on a list of fake sites</h3>
        <p id="phishtext"></p>
        <div class="lists" id="phishlists"></div>
        <p>Lists are sometimes wrong, so you can still go in, but it takes the held lever.</p>
        <div class="keys">
          <button class="key primary sm" id="phishback" type="button">Go back<span class="k">A</span></button>
        </div>
        <div class="keys" style="margin-top:16px" id="phishlever"></div>
      </div>
      <div class="plate" id="crashplate" hidden>
        <i class="cracks"></i>
        <span class="plq red">THIS PAGE CRASHED</span>
        <h3 id="crashtitle">This page stopped working</h3>
        <p>The page broke, not your PC. Reload brings it back.</p>
        <div class="keys">
          <button class="key primary sm" id="crashreload" type="button">Reload<span class="k">A</span></button>
          <button class="key sm" id="crashclose" type="button">Close the tab<span class="k">Z</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="browser.js" type="module"></script>
</body>
</html>
