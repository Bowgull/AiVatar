<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Served from 127.0.0.1 like every page here. font-src is for the bundled faces (6.10).
     No frame-src at all: unlike the pop-out, nothing from the internet is ever shown in the bubble. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;
               font-src 'self'; style-src-attr 'unsafe-inline';
               form-action 'none'; base-uri 'none'">
<title>Aang</title>
<link rel="stylesheet" href="cockpit.css">
<link rel="stylesheet" href="bubble.css">
</head>
<body>

<!-- The whole window is see-through; only this is drawn. `hidden` until there is something to say, so
     an empty bubble is never a faint rectangle floating beside him. -->
<!-- The wrapper exists for one reason: the parchment clips anything outside its edges (that is what
     keeps its texture inside the rounded corners), and the copy and rate keys straddle the top edge by
     design. Inside the parchment they were clipped off and could never be seen (sweep, 2026-10-04). -->
<div id="wrap" class="wrap tail">
  <!-- The balloon itself. #bubble carries the text and the buttons; its SHAPE is drawn here, behind
       it, as one SVG path: the soft-edged rectangle and the comic tail as a single closed outline,
       so the ink line runs round the body and out along the tail with no seam. balloon.js regenerates
       it whenever the reply changes size, because stretching a fixed shape would distort the corners
       and the tail. Outside #bubble because the parchment clips its own children. -->
  <svg id="skin" class="skin" aria-hidden="true"></svg>
  <!-- Copy, INSIDE the panel's bottom-right, on a finished reply while the mouse is over it.
       The thumbs went on 2026-10-04: ratings.jsonl was written and never read, six ratings existed in
       the whole life of the app and three of those were taken back, and "Forget this" in the
       right-click menu already covers "do not keep this". -->
<div id="bubble" class="parch tex" hidden>

  <!-- Who is speaking and what it cost. Deliberately small and above the words, like the old one. -->
  <p class="who"><span id="who"></span></p>

  <!-- The reply. `lines` is what the collapse arrow measures, so the text and its measurement can
       never disagree. -->
  <div id="scroller" class="scroller">
    <p id="said" class="t-body said"></p>
  </div>

  <!-- Over six lines: the bobbing arrow. A click grows it to twelve, then it scrolls. -->
  <button id="more" class="more" hidden aria-label="Show the rest">
    <!-- Sheet 5's chevron, verbatim: drawn twice, a thick near-black stroke with gold over it, which
         is what makes it look carved rather than typed. It was a text character here until a diff
         against the sheet found it (2026-10-04). -->
    <svg class="arrow" viewBox="0 0 30 19" aria-hidden="true">
      <path d="M3 3 L15 14 L27 3" fill="none" stroke="#120A05" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 3 L15 14 L27 3" fill="none" stroke="#C98C14" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Working on it. The dots and, under them, what the tool is actually doing. -->
  <div id="working" class="working" hidden>
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="doing" class="doing"></span>
  </div>

  <!-- A question that has to be answered before anything happens. Keycaps, A / X / Z, as today. -->
  <div id="asks" class="keys asks" hidden></div>

  <!-- Copy, INSIDE the panel's bottom-right, on a finished reply while the mouse is over it.
       The thumbs went on 2026-10-04: ratings.jsonl was written and never read, six ratings existed in
       the whole life of the app and three of those were taken back, and "Forget this" in the
       right-click menu already covers "do not keep this". -->
  <div id="tools" class="tools" hidden>
    <button id="copy" class="mini" title="Copy this reply">Copy</button>
  </div>



</div>
</div>

<script src="bubble.js" type="module"></script>
</body>
</html>
