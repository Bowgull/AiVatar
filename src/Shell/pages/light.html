<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Autofill's light (sheet 77, 2026-10-23): Samara's own small layer beside the box he clicked, never part of the page.
     It shows what it carries (a letter for an email, a name card for his details, a key for a login) and the value;
     a click, or Tab in the box, fills; the scroll wheel on it flicks to his next email. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Samara light</title>
<link rel="stylesheet" href="cockpit.css">
<link rel="stylesheet" href="light.css">
</head>
<body>
<div class="light" id="light"><div class="orb"></div><span class="item" id="item"></span><div class="tag" id="tag" hidden><span class="v" id="v"></span></div></div>
<script src="light.js"></script>
</body>
</html>
