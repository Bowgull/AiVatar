<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Your things (his design, 2026-10-12): History and Downloads as their own tab, in the Settings look. Everything
     drawn with textContent (titles and addresses are websites' own words); the only doors are window.things. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; base-uri 'none'">
<title>Your things</title>
<link rel="stylesheet" href="cockpit.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="things.css">
</head>
<body>
<div class="set">
  <nav class="side" aria-label="Your things">
    <h1>Your things</h1>
    <a href="#history" data-sec="history"><i><svg viewBox="0 0 7 7" width="14" height="14" shape-rendering="crispEdges"><path d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM3 2h1v2H3zM4 3h1v1H4zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2z"/></svg></i>History</a>
    <a href="#downloads" data-sec="downloads"><i><svg viewBox="0 0 7 8" width="14" height="16" shape-rendering="crispEdges"><path d="M2 0h3v2H2zM0 2h7v1H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3zM0 7h7v1H0z"/></svg></i>Downloads</a>
    <a href="#bookmarks" data-go="bookmarks"><i><svg viewBox="0 0 9 8" width="16" height="14" shape-rendering="crispEdges"><path d="M1 0h2v1H1zM6 0h2v1H6zM0 1h4v4H0zM5 1h4v4H5zM0 5h1v1H0zM8 5h1v1H8zM0 6h4v1H0zM5 6h4v1H5zM3 7h3v1H3z"/></svg></i>Bookmarks</a>
  </nav>
  <main class="main">
    <section data-sec="history">
      <h2>History</h2>
      <p class="lead">Every page you opened in the last 90 days. Only on this PC.</p>
      <div class="search"><svg viewBox="0 0 7 7" width="14" height="14" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h3v1H1zM0 1h1v3H0zM4 1h1v3H4zM1 4h3v1H1zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6z"/></svg>
        <input id="q" type="search" spellcheck="false" autocomplete="off" placeholder="Search your history" aria-label="Search your history"></div>
      <div id="days"></div>
      <p class="empty" id="hempty" hidden></p>
      <div class="foot">
        <button class="pick" type="button" id="older" hidden>Show older</button>
        <span class="grow"></span>
        <span class="clear" id="clearbox"><button class="pick danger" type="button" id="clear">Clear history</button></span>
      </div>
    </section>

    <section data-sec="downloads" hidden>
      <h2>Downloads</h2>
      <p class="lead">Click a file to open it. Drag it into Claude, Aang, a folder or the desktop.</p>
      <div class="card"><i class="caps"></i>
        <h3>YOUR FILES</h3>
        <div id="dlist"></div>
        <p class="empty pad" id="dempty" hidden>Nothing downloaded yet.</p>
      </div>
      <div class="foot"><button class="pick" type="button" id="dfolder">Open Downloads folder</button></div>
    </section>
  </main>
</div>
<script src="things.js"></script>
</body>
</html>
